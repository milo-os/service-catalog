name: Verify Codegen

on:
  push:
  pull_request:

jobs:
  verify:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.24.0'

      - name: Verify generated code is up to date
        run: bash hack/verify-codegen.sh
