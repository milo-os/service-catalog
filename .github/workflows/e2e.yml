name: E2E Tests

on:
  push:
  pull_request:

jobs:
  e2e:
    name: Chainsaw E2E
    runs-on: ubuntu-latest
    env:
      TASK_X_REMOTE_TASKFILES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Spin up kind cluster
        run: task --yes test-infra:cluster-up

      - name: Build container image
        run: task dev:build

      - name: Load image into kind
        run: task dev:load

      - name: Install billing CRDs
        env:
          KUBECONFIG: .test-infra/kubeconfig
        run: |
          task --yes test-infra:kubectl -- apply -f config/overlays/e2e/billing-crds.yaml
          task --yes test-infra:kubectl -- wait kustomization/billing-crds \
            -n flux-system --for=condition=ready --timeout=120s

      - name: Install LocationBinding CRD
        env:
          KUBECONFIG: .test-infra/kubeconfig
        run: |
          task --yes test-infra:kubectl -- apply -f config/overlays/e2e/locationbinding-crd.yaml

      - name: Install resourcemanager CRDs
        env:
          KUBECONFIG: .test-infra/kubeconfig
        run: |
          task --yes test-infra:kubectl -- apply -f config/overlays/e2e/resourcemanager-crds.yaml

      - name: Deploy services (e2e overlay)
        env:
          KUBECONFIG: .test-infra/kubeconfig
        run: |
          task --yes test-infra:kubectl -- apply -k config/overlays/e2e
          task --yes test-infra:kubectl -- wait --for=condition=available \
            deployment/services-controller-manager \
            -n services-system --timeout=120s

      - name: Wait for webhook certificate to be ready
        env:
          KUBECONFIG: .test-infra/kubeconfig
        run: |
          task --yes test-infra:kubectl -- wait --for=condition=ready \
            certificate/services-serving-cert \
            -n services-system --timeout=120s

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@v0.2.14

      - name: Run E2E tests
        env:
          KUBECONFIG: .test-infra/kubeconfig
        run: task e2e

  e2e-milo:
    name: Chainsaw E2E (multi-project, real Milo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # This environment brings up its own kind cluster rather than test-infra's:
      # it needs a host port mapped through to Milo, because the suites address
      # project control planes from outside the cluster.
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.24.0

      # The Milo and billing manifests are published as Flux OCI artifacts.
      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Set up the environment
        run: task e2e-milo:setup

      - name: Run multi-project E2E tests
        run: task e2e-milo

      - name: Dump operator logs on failure
        if: failure()
        run: |
          kubectl --kubeconfig bin/e2e-milo/kind.kubeconfig -n services-system logs \
            deployment/services-controller-manager --tail=-1 || true
          kubectl --kubeconfig bin/e2e-milo/kind.kubeconfig -n milo-system logs \
            deployment/milo-apiserver --tail=200 || true
