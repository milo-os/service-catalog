name: Observability

on:
  push:
    paths:
      - "observability/**"
      - "config/components/observability/**"
      - ".github/workflows/observability.yml"
  pull_request:
    paths:
      - "observability/**"
      - "config/components/observability/**"
      - ".github/workflows/observability.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  verify-dashboard:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MILO_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Install Jsonnet tools
        run: |
          go install github.com/google/go-jsonnet/cmd/jsonnet@v0.21.0
          go install github.com/jsonnet-bundler/jsonnet-bundler/cmd/jb@v0.6.0
      - name: Verify generated dashboard
        run: |
          cd observability
          jb install
          task --taskfile Taskfile.yaml verify ROOT_DIR="$GITHUB_WORKSPACE"
      - name: Install promtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/prometheus-3.5.0.linux-amd64" >> "$GITHUB_PATH"
      - name: Test alert rules
        run: |
          cd observability
          task --taskfile Taskfile.yaml test-alerts ROOT_DIR="$GITHUB_WORKSPACE"
      - name: Validate observability component
        run: kubectl kustomize config/components/observability >/dev/null
