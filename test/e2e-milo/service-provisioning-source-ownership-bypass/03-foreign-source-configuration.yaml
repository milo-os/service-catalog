# Declares a projection reading out of a project the service is not published
# from. A provider that could name any project would have the platform read it
# with an identity nothing stops: the operator holds system:masters in every
# project control plane.
#
# This document only reaches etcd because the step applying it disabled the
# ServiceConfiguration webhook. That stands in for the real cases: a webhook
# removed from the control plane, and a document admitted before the check
# existed. The ServiceConfiguration schema cannot catch this one — ownership is
# a fact about another object — so the controller is the only thing left.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: e2e-bypass-networking
spec:
  serviceRef:
    name: e2e-bypass-networking
  phase: Published
  provisioning:
    resources:
      - name: someone-elses-classes
        projection:
          sourceProject: e2e-provisioning-consumer-b
          kind:
            group: ipam.miloapis.com
            version: v1alpha1
            kind: IPClass
          reference:
            fieldPath: source
            projectKey: project
            nameKey: name
          selector:
            matchLabels:
              bypass.e2e.datumapis.com/shared: "true"
