apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: service-provisioning-source-ownership-bypass
spec:
  description: |
    A service may project only out of the project it is published from, and
    that has to hold when admission does not run.

    Most of what bounds a projection is now in the ServiceConfiguration schema —
    a dotted API group, a served version, a reference that is two keys at one
    path in spec — and the API server enforces that whether or not the webhook
    is there. Source ownership is the one bound it cannot express: it is a fact
    about another object, the Service, and so it lives in the webhook and in the
    controller.

    This suite covers the second. It disables the ServiceConfiguration webhook,
    lands a declaration reading out of a project the service does not own
    directly in etcd, and asserts the controller refuses it and says so on the
    consumer's entitlement.

    That is not a hypothetical bypass. The webhook can be removed from the
    control plane, its failure policy can be relaxed, and a document admitted
    before a check existed stays in etcd unchanged. The check in the controller
    is what actually bounds what gets written — which matters because RBAC does
    not: the operator reaches project control planes as an identity in
    system:masters.

    The refusal is not vacuous. The named source project is real, engaged, and
    holds a class the declaration's selector matches, so a controller that
    trusted the document would install it.

    The webhook is restored by the step's `finally`, including on failure.

  steps:
    - name: setup
      try:
        - apply:
            cluster: root
            file: 01-setup.yaml
        - apply:
            cluster: consumer-b
            file: 02-foreign-source-class.yaml

    - name: bypass-admission-and-verify-controller-refuses
      description: |
        Narrow the ServiceConfiguration webhook to an objectSelector nothing
        carries, land the foreign-source declaration, and assert the controller
        refuses it anyway — reporting the refusal per resource and leaving Ready
        alone, because a refusal to deliver is not a denial of access.

        Disable, exercise, and assert all sit in one step so the step's `finally`
        restores the webhook even when an assertion fails.
      try:
        - script:
            cluster: root
            timeout: 60s
            content: |
              set -eu
              wh=$(kubectl get validatingwebhookconfigurations -o name \
                | grep -i services | head -1)
              idx=$(kubectl get "$wh" -o json \
                | jq '.webhooks | map(.name) | index("vserviceconfiguration.kb.io")')
              if [ "$idx" = "null" ] || [ -z "$idx" ]; then
                echo "vserviceconfiguration.kb.io not found on $wh"
                kubectl get "$wh" -o json | jq '.webhooks | map(.name)'
                exit 1
              fi
              kubectl patch "$wh" --type=json -p "[{\"op\":\"add\",\"path\":\"/webhooks/$idx/objectSelector\",\"value\":{\"matchLabels\":{\"services.miloapis.com/admission\":\"disabled-for-e2e\"}}}]"
        - apply:
            cluster: root
            file: 03-foreign-source-configuration.yaml
        - apply:
            cluster: consumer-a
            file: 04-create-entitlement.yaml
        - assert:
            cluster: consumer-a
            timeout: 120s
            file: assertions/assert-refused-by-controller.yaml
        - error:
            cluster: consumer-a
            timeout: 30s
            file: assertions/assert-nothing-installed.yaml
        # The source project the declaration named must also be untouched: a
        # refusal to read is not a licence to write back.
        - error:
            cluster: consumer-b
            timeout: 30s
            file: assertions/assert-nothing-installed.yaml
      finally:
        - script:
            cluster: root
            timeout: 60s
            content: |
              set -eu
              wh=$(kubectl get validatingwebhookconfigurations -o name \
                | grep -i services | head -1)
              idx=$(kubectl get "$wh" -o json \
                | jq '.webhooks | map(.name) | index("vserviceconfiguration.kb.io")')
              if [ "$idx" != "null" ] && [ -n "$idx" ]; then
                kubectl patch "$wh" --type=json \
                  -p "[{\"op\":\"remove\",\"path\":\"/webhooks/$idx/objectSelector\"}]" || true
              fi
