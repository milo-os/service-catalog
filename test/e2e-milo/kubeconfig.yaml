# One context per addressable control plane, committed rather than generated.
#
# Nothing here is discovered at run time: Milo is reached through the Gateway
# test-infra already exposes on the host, a project control plane is the same
# Milo behind its own URL path, and the token is the static one
# config/overlays/e2e-milo/milo/auth.yaml installs. A generated file would carry
# the same bytes every run.
#
# Port 30443 is the NodePort test-infra's EnvoyProxy assigns the gateway's 8443
# listener, mapped to the host by its kind config. Addressed as localhost rather
# than 127.0.0.1 so TLS sends SNI, which the gateway's certificate names.
apiVersion: v1
kind: Config
current-context: milo-root
clusters:
  - name: milo-root
    cluster:
      server: https://localhost:30443
      insecure-skip-tls-verify: true
  - name: e2e-provisioning-platform
    cluster:
      server: https://localhost:30443/apis/resourcemanager.miloapis.com/v1alpha1/projects/e2e-provisioning-platform/control-plane
      insecure-skip-tls-verify: true
  - name: e2e-provisioning-consumer-a
    cluster:
      server: https://localhost:30443/apis/resourcemanager.miloapis.com/v1alpha1/projects/e2e-provisioning-consumer-a/control-plane
      insecure-skip-tls-verify: true
  - name: e2e-provisioning-consumer-b
    cluster:
      server: https://localhost:30443/apis/resourcemanager.miloapis.com/v1alpha1/projects/e2e-provisioning-consumer-b/control-plane
      insecure-skip-tls-verify: true
users:
  - name: e2e-admin
    user:
      token: e2e-milo-admin-token
contexts:
  - name: milo-root
    context: {cluster: milo-root, user: e2e-admin}
  - name: e2e-provisioning-platform
    context: {cluster: e2e-provisioning-platform, user: e2e-admin}
  - name: e2e-provisioning-consumer-a
    context: {cluster: e2e-provisioning-consumer-a, user: e2e-admin}
  - name: e2e-provisioning-consumer-b
    context: {cluster: e2e-provisioning-consumer-b, user: e2e-admin}
