# Same shape as assert-entitlement-provisioned.yaml, asserted against
# consumer-b after the provider narrowed its selector to the premium class.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceEntitlement
metadata:
  name: e2e-provisioning-networking
status:
  phase: Active
  (conditions[?type == 'Ready']):
    - status: "True"
  (conditions[?type == 'Provisioned']):
    - status: "True"
      reason: Provisioned
  provisionedResources:
    - name: shared-classes
      state: Installed
      objectCount: 1
      kind:
        group: networking.datumapis.com
        kind: IPClass
