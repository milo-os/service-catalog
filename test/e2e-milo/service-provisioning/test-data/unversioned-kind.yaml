# The provider names the version, because the provider owns the API. Omitting it
# leaves the platform guessing which version to read and write.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: e2e-provisioning-unversioned
spec:
  serviceRef:
    name: e2e-provisioning-networking
  phase: Draft
  provisioning:
    resources:
      - name: unversioned
        projection:
          sourceProject: e2e-provisioning-platform
          kind:
            group: ipam.miloapis.com
            kind: IPClass
          reference:
            fieldPath: source
            projectKey: project
            nameKey: name
          selector:
            matchLabels:
              ipam.miloapis.com/shared: "true"
