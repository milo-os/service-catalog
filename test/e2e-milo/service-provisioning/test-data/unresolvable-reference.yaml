# A projection says where the reference goes, not what it contains. A path that
# climbs out of spec, or two values under one key, is not a reference and is
# refused before it can become a write.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: e2e-provisioning-bad-reference
spec:
  serviceRef:
    name: e2e-provisioning-networking
  phase: Draft
  provisioning:
    resources:
      - name: escaping-reference
        projection:
          sourceProject: e2e-provisioning-platform
          kind:
            group: ipam.miloapis.com
            version: v1alpha1
            kind: IPClass
          reference:
            fieldPath: ../metadata.ownerReferences
            projectKey: project
            nameKey: name
          selector:
            matchLabels:
              ipam.miloapis.com/shared: "true"
