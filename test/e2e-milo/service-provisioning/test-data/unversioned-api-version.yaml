# The provider names the version, because the provider owns the API. Omitting it
# leaves the platform guessing which version to write at.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: e2e-provisioning-unversioned
spec:
  serviceRef:
    name: e2e-provisioning-networking
  phase: Draft
  provisioning:
    resources:
      - name: unversioned
        objects:
          - apiVersion: ipam.miloapis.com
            kind: IPClass
            metadata:
              name: e2e-unversioned
