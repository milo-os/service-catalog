# A provider may only project out of the project its Service is published from.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: e2e-provisioning-foreign-source
spec:
  serviceRef:
    name: e2e-provisioning-networking
  phase: Draft
  provisioning:
    resources:
      - name: someone-elses-classes
        projection:
          sourceProject: not-my-project
          kind:
            group: ipam.miloapis.com
            version: v1alpha1
            kind: IPClass
          # The provider states how its API spells a cross-project reference.
          # The platform writes those two values there and nothing else.
          reference:
            fieldPath: source
            projectKey: project
            nameKey: name
          selector:
            matchLabels:
              ipam.miloapis.com/shared: "true"
