# The core group cannot be named at all. An embedded object's group must be a
# dotted domain, so no declaration can produce a Secret, a ConfigMap, or a
# ServiceAccount — the shape excludes them rather than a list of names doing it.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: e2e-provisioning-core-group
spec:
  serviceRef:
    name: e2e-provisioning-networking
  phase: Draft
  provisioning:
    resources:
      - name: core-kind
        objects:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: e2e-not-allowed
            stringData:
              token: hunter2
