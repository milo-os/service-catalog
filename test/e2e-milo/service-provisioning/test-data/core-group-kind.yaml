# The core group cannot be named at all. A projection writes a map at one field
# path in spec, and no core kind takes its content there — Secret and
# ServiceAccount have no spec — so the shape excludes them rather than a list of
# names doing it.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: e2e-provisioning-core-group
spec:
  serviceRef:
    name: e2e-provisioning-networking
  phase: Draft
  provisioning:
    resources:
      - name: core-kind
        projection:
          sourceProject: e2e-provisioning-platform
          kind:
            group: ""
            version: v1
            kind: Secret
          reference:
            fieldPath: data
            projectKey: project
            nameKey: name
          selector:
            matchLabels:
              ipam.miloapis.com/shared: "true"
