# The provider's own classes, in its own project's control plane, reached over
# its own URL path and separate from either consumer's.
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClass
metadata:
  name: e2e-public-unicast
  labels:
    ipam.miloapis.com/shared: "true"
spec:
  ipFamily: IPv4
  defaultPrefixLength: 24
---
apiVersion: ipam.miloapis.com/v1alpha1
kind: IPClass
metadata:
  name: e2e-internal-only
  labels:
    ipam.miloapis.com/tier: premium
spec:
  ipFamily: IPv4
  defaultPrefixLength: 26
