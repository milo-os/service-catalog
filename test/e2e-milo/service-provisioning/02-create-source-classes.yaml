# The provider's own classes, in its own project's control plane — a different
# control plane from either consumer's, reached over its own URL path.
apiVersion: networking.datumapis.com/v1alpha
kind: IPClass
metadata:
  name: e2e-public-unicast
  labels:
    networking.datumapis.com/shared: "true"
spec:
  prefixes:
    - 192.0.2.0/24
---
apiVersion: networking.datumapis.com/v1alpha
kind: IPClass
metadata:
  name: e2e-internal-only
  labels:
    networking.datumapis.com/tier: premium
spec:
  prefixes:
    - 198.51.100.0/24
