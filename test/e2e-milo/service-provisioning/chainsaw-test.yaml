apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: service-provisioning-isolation
spec:
  description: |
    Provisioning across genuinely separate project control planes.

    The operator here runs against a real Milo with the Milo multicluster
    provider — no --enable-single-cluster-for-e2e-tests. Three real Projects
    exist, and each is addressed over its own control-plane path, which Milo
    routes to its own storage. So the claim this suite makes about consumer-b is
    a claim about a different control plane, not a different name for the same
    one.

    Four properties, in order:

      1. the entitled project receives the declared objects;
      2. the unentitled project receives nothing;
      3. removing the entitlement prunes from the entitled project and leaves
         the other untouched;
      4. admission refuses objects the platform will not write, and an edited
         declaration converges.

    (2) is the one that could pass for the wrong reason. An unreachable plane,
    or one not serving IPClass, is also a plane with no IPClasses in it. So
    consumer-b carries a control object the test creates in it directly (see
    02-seed-unentitled-control.yaml), asserted alongside every absence claim,
    and at the end consumer-b is entitled and shown to receive — a plane that
    can receive is a plane whose earlier emptiness meant something.

    What this environment does NOT show is per-project authorization: Milo runs
    RBAC-only here and a root grant authorizes every project path, so the
    isolation demonstrated is routing and storage. See test/e2e-milo/README.md.

    The IPClass CRD installed for e2e carries the real API's shape — a class is
    a definition or a source-only reference, never both — so an installed object
    that is not a well-formed reference is refused. It performs none of the real
    API's authorization on spec.source, so the authorization gap the ledger
    reports is asserted from the ledger rather than observed from a refusal.

  steps:
    - name: publish-service
      description: Publish the Service. It lives at the platform root, in no project.
      cluster: root
      try:
        - apply:
            file: 01-create-service.yaml
        - assert:
            timeout: 30s
            resource:
              apiVersion: services.miloapis.com/v1alpha1
              kind: Service
              metadata:
                name: e2e-provisioning-networking
              spec:
                phase: Published

    - name: seed-unentitled-control
      description: |
        The control object in consumer-b, and proof the plane is reachable and
        serves this kind before anything is claimed about what it does not have.
      cluster: consumer-b
      try:
        - apply:
            file: 02-seed-unentitled-control.yaml
        - assert:
            timeout: 30s
            file: assertions/assert-control-object-present.yaml

    - name: reject-objects-the-platform-will-not-write
      description: |
        First of two enforcement points. An embedded object is arbitrary, so
        what admission checks is whether the platform can write it: a dotted API
        group, a served version, a name it can install under, no namespace it
        does not create, and none of the metadata the platform itself owns. A
        declaration contending with itself over one name is refused too, because
        the provider now chooses the name.

        Which objects are acceptable is not decided here. The API that owns a
        kind decides whether it will accept the object, and it says so by
        accepting or refusing the write.
      cluster: root
      try:
        - apply:
            file: test-data/unversioned-api-version.yaml
            expect:
              - check:
                  ($error != null): true
        - apply:
            file: test-data/core-group-object.yaml
            expect:
              - check:
                  ($error != null): true
        - apply:
            file: test-data/namespaced-object.yaml
            expect:
              - check:
                  ($error != null): true
        - apply:
            file: test-data/platform-owned-metadata.yaml
            expect:
              - check:
                  ($error != null): true
        - apply:
            file: test-data/duplicate-object-name.yaml
            expect:
              - check:
                  ($error != null): true

    - name: publish-provisioning-declaration
      description: |
        Publishing the declaration alone installs nothing, in either project:
        delivery is keyed on a consumer's entitlement, never on the provider's
        document. A provider cannot target projects.
      try:
        - apply:
            cluster: root
            file: 03-publish-configuration.yaml
        - assert:
            cluster: root
            timeout: 30s
            resource:
              apiVersion: services.miloapis.com/v1alpha1
              kind: ServiceConfiguration
              metadata:
                name: e2e-provisioning-networking
              spec:
                phase: Published
        - error:
            cluster: consumer-a
            timeout: 30s
            file: assertions/assert-nothing-provisioned.yaml
        - error:
            cluster: consumer-b
            timeout: 30s
            file: assertions/assert-nothing-provisioned.yaml

    - name: entitle-and-receive-objects
      description: |
        An Active entitlement in consumer-a receives the declared object, owned
        by the entitlement and labelled for pruning, and reports delivery on a
        Provisioned condition separate from Ready.
      cluster: consumer-a
      try:
        - apply:
            file: 04-create-entitlement.yaml
        - assert:
            timeout: 90s
            file: assertions/assert-entitlement-provisioned.yaml
        - assert:
            timeout: 90s
            file: assertions/assert-class-installed.yaml
        - error:
            timeout: 30s
            file: assertions/assert-undeclared-class-not-installed.yaml
        - assert:
            timeout: 30s
            file: assertions/assert-authorization-gap-reported.yaml

    - name: unentitled-project-receives-nothing
      description: |
        The property the whole capability rests on. consumer-b holds no
        entitlement for this service and must hold nothing from it — asserted
        against a plane whose control object is present in the same breath, so
        an empty answer cannot be mistaken for an absent one.
      cluster: consumer-b
      try:
        - assert:
            timeout: 30s
            file: assertions/assert-control-object-present.yaml
        - error:
            timeout: 30s
            file: assertions/assert-nothing-provisioned.yaml
        # Named absence as well as labelled absence: the object consumer-a
        # received, by the exact name it received it under.
        - error:
            timeout: 30s
            resource:
              apiVersion: ipam.miloapis.com/v1alpha1
              kind: IPClass
              metadata:
                name: e2e-shared-unicast
        # consumer-b must not have acquired an entitlement of its own along the
        # way; without this the absence above could be read as "not yet".
        - error:
            timeout: 30s
            resource:
              apiVersion: services.miloapis.com/v1alpha1
              kind: ServiceEntitlement
              metadata:
                name: e2e-provisioning-networking

    - name: converge-on-declaration-change
      description: |
        Editing the embedded object is how a provider changes what consumers
        hold. It reaches an already-entitled project, withdraws the object it no
        longer declares, and still reaches no one else.
      try:
        - script:
            cluster: root
            timeout: 30s
            content: |
              set -e
              kubectl patch serviceconfiguration e2e-provisioning-networking --type=json \
                -p '[{"op":"replace","path":"/spec/provisioning/resources/0/objects/0","value":{"apiVersion":"ipam.miloapis.com/v1alpha1","kind":"IPClass","metadata":{"name":"e2e-premium-anycast"},"spec":{"source":{"project":"e2e-provisioning-platform","name":"e2e-internal-only"}}}}]'
        - assert:
            cluster: consumer-a
            timeout: 90s
            file: assertions/assert-converged-class-installed.yaml
        - error:
            cluster: consumer-a
            timeout: 90s
            file: assertions/assert-original-class-pruned.yaml
        - assert:
            cluster: consumer-b
            timeout: 30s
            file: assertions/assert-control-object-present.yaml
        - error:
            cluster: consumer-b
            timeout: 30s
            file: assertions/assert-nothing-provisioned.yaml

    - name: prune-on-disablement
      description: |
        Disabling the service removes what it installed from the project that
        held it, and touches nothing in the project that never did. The
        reconciler prunes explicitly while the entitlement is terminating rather
        than relying on garbage collection, so teardown does not depend on the
        project purger — which does not delete cluster-scoped resources at all.
      try:
        - delete:
            cluster: consumer-a
            ref:
              apiVersion: services.miloapis.com/v1alpha1
              kind: ServiceEntitlement
              name: e2e-provisioning-networking
        - error:
            cluster: consumer-a
            timeout: 90s
            file: assertions/assert-nothing-provisioned.yaml
        - assert:
            cluster: consumer-b
            timeout: 30s
            file: assertions/assert-control-object-present.yaml

    - name: entitling-the-other-project-delivers
      description: |
        The closing half of the positive control. consumer-b was empty because
        it was not entitled, not because it could not receive: entitle it and
        the object the provider currently declares arrives, in the plane every
        absence above was asserted against.
      cluster: consumer-b
      try:
        - apply:
            file: 04-create-entitlement.yaml
        - assert:
            timeout: 90s
            file: assertions/assert-entitlement-provisioned-premium.yaml
        - assert:
            timeout: 90s
            file: assertions/assert-consumer-b-provisioned.yaml
        # And consumer-a, now unentitled, is the one holding nothing: the same
        # claim as before with the projects exchanged.
        - error:
            cluster: consumer-a
            timeout: 30s
            file: assertions/assert-nothing-provisioned.yaml
