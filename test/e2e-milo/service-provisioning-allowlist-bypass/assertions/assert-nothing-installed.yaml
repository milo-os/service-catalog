# The declaration named a denied kind, so nothing may be installed for this
# entitlement. Checked on the allowlisted kind rather than the denied one: an
# IPClass is what the controller could legitimately have written, so its absence
# says the refusal happened rather than that the denied kind is unserved.
apiVersion: networking.datumapis.com/v1alpha
kind: IPClass
metadata:
  labels:
    app.kubernetes.io/managed-by: services.miloapis.com
    services.miloapis.com/entitlement: e2e-bypass-networking
