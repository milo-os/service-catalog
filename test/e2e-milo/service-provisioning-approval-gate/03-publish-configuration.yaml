apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: e2e-gated-networking
spec:
  serviceRef:
    name: e2e-gated-networking
  phase: Published
  provisioning:
    resources:
      - name: gated-classes
        projection:
          sourceProject: e2e-provisioning-platform
          kind:
            group: ipam.miloapis.com
            version: v1alpha1
            kind: IPClass
          # The provider states how its API spells a cross-project reference.
          # The platform writes those two values there and nothing else.
          reference:
            fieldPath: source
            projectKey: project
            nameKey: name
          selector:
            matchLabels:
              gated.e2e.datumapis.com/shared: "true"
