apiVersion: services.miloapis.com/v1alpha1
kind: ServiceConfiguration
metadata:
  name: e2e-gated-networking
spec:
  serviceRef:
    name: e2e-gated-networking
  phase: Published
  provisioning:
    resources:
      - name: gated-classes
        projection:
          sourceProject: e2e-provisioning-platform
          kind:
            group: networking.datumapis.com
            kind: IPClass
          selector:
            matchLabels:
              gated.e2e.datumapis.com/shared: "true"
