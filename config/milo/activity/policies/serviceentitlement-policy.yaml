# ActivityPolicy for ServiceEntitlement resources.
#
# A ServiceEntitlement is how a project asks for a service. Creating one is the
# access request, and for a GatedByProvider service the provider's approval or
# rejection follows. The project's activity feed shows all three.
#
# The API server logs services.miloapis.com writes at the Metadata audit level,
# so audit.requestObject is absent and only audit.objectRef is available. By
# convention an entitlement is named after the service ("compute"), so the
# objectRef name reads correctly. The rules that read requestObject take over
# if the audit level is raised to RequestResponse.
#
# Entitlements the controller creates for a service's dependencies are written
# by a system identity. The rules exclude those, so the feed shows only the
# service a person asked for.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: services.miloapis.com-serviceentitlement
spec:
  resource:
    apiGroup: services.miloapis.com
    kind: ServiceEntitlement

  auditRules:
    - name: requested-with-message
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && audit.responseStatus.code < 400 && has(audit.requestObject.spec) && has(audit.requestObject.spec.serviceRef) && has(audit.requestObject.spec.requestMessage) && audit.requestObject.spec.requestMessage != ''"
      summary: "{{ actor }} requested access to {{ link(audit.requestObject.spec.serviceRef.name, audit.objectRef) }}: \"{{ audit.requestObject.spec.requestMessage }}\""

    - name: requested
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && audit.responseStatus.code < 400 && has(audit.requestObject.spec) && has(audit.requestObject.spec.serviceRef)"
      summary: "{{ actor }} requested access to {{ link(audit.requestObject.spec.serviceRef.name, audit.objectRef) }}"

    - name: requested-fallback
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && audit.responseStatus.code < 400"
      summary: "{{ actor }} requested access to {{ link(audit.objectRef.name, audit.objectRef) }}"

  # The provider decides a GatedByProvider request in its own project, so the
  # consumer project sees no audit entry for it. The services controller emits
  # these events into the consumer project when the entitlement's phase
  # changes to reflect the decision. The approver's identity stays with the
  # provider, so the summaries name the decision and not who made it.
  #
  # Annotations on these events:
  #   services.miloapis.com/service-display-name: Compute
  #   services.miloapis.com/service-name: compute.datumapis.com
  #   services.miloapis.com/decision-message: the provider's message, if any
  eventRules:
    - name: approved
      match: "event.reason == 'EntitlementApproved' && has(event.metadata.annotations) && 'services.miloapis.com/service-display-name' in event.metadata.annotations"
      summary: "Access to {{ link(event.metadata.annotations['services.miloapis.com/service-display-name'], event.regarding) }} was approved"

    - name: approved-fallback
      match: "event.reason == 'EntitlementApproved'"
      summary: "Access to {{ link(event.regarding.name, event.regarding) }} was approved"

    - name: rejected-with-message
      match: "event.reason == 'EntitlementRejected' && has(event.metadata.annotations) && 'services.miloapis.com/service-display-name' in event.metadata.annotations && 'services.miloapis.com/decision-message' in event.metadata.annotations"
      summary: "Access to {{ link(event.metadata.annotations['services.miloapis.com/service-display-name'], event.regarding) }} was rejected: \"{{ event.metadata.annotations['services.miloapis.com/decision-message'] }}\""

    - name: rejected
      match: "event.reason == 'EntitlementRejected' && has(event.metadata.annotations) && 'services.miloapis.com/service-display-name' in event.metadata.annotations"
      summary: "Access to {{ link(event.metadata.annotations['services.miloapis.com/service-display-name'], event.regarding) }} was rejected"

    - name: rejected-fallback
      match: "event.reason == 'EntitlementRejected'"
      summary: "Access to {{ link(event.regarding.name, event.regarding) }} was rejected"
