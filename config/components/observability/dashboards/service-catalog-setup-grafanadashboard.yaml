apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: service-catalog-setup-dashboard
  labels:
    dashboards: grafana
spec:
  folder: "Platform / Services"
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 30s
  configMapRef:
    name: service-catalog-setup-dashboard
    key: service-catalog-setup.json
