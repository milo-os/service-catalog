apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: services-system

configMapGenerator:
  - name: service-catalog-setup-dashboard
    files:
      - generated/service-catalog-setup.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
  - name: service-catalog-adoption-dashboard
    files:
      - generated/service-catalog-adoption.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

resources:
  - service-catalog-setup-grafanadashboard.yaml
  - service-catalog-adoption-grafanadashboard.yaml
