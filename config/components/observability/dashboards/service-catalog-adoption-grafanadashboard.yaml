apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: service-catalog-adoption-dashboard
  labels:
    dashboards: vm-grafana
spec:
  folder: "Platform / Services"
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: vm-grafana
  resyncPeriod: 30s
  configMapRef:
    name: service-catalog-adoption-dashboard
    key: service-catalog-adoption.json
