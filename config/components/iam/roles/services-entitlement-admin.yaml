apiVersion: iam.miloapis.com/v1alpha1
kind: Role
metadata:
  name: services.miloapis.com-entitlement-admin
  annotations:
    kubernetes.io/display-name: Services Entitlement Admin
    kubernetes.io/description: "Manage service entitlements; view service consumers"
spec:
  launchStage: Alpha
  inheritedRoles:
    - name: services.miloapis.com-entitlement-viewer
  includedPermissions:
    - services.miloapis.com/serviceentitlements.create
    - services.miloapis.com/serviceentitlements.update
    - services.miloapis.com/serviceentitlements.patch
    - services.miloapis.com/serviceentitlements.delete
