apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: services.miloapis.com-serviceentitlement
spec:
  serviceRef:
    name: "services.miloapis.com"
  kind: ServiceEntitlement
  plural: serviceentitlements
  singular: serviceentitlement
  permissions:
    - list
    - get
    - create
    - update
    - patch
    - delete
    - watch
    # activate grants a provider actor permission to request activation in
    # this consumer project. It does not grant direct entitlement writes.
    - activate
    # manage grants the services controller permission to set protected
    # entitlement fields such as spec.providerActivation.
    - manage
  subresources:
    - name: status
      permissions:
        - get
        - update
        - patch
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
