apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: services.miloapis.com-serviceconsumer
spec:
  serviceRef:
    name: "services.miloapis.com"
  kind: ServiceConsumer
  plural: serviceconsumers
  singular: serviceconsumer
  permissions:
    - list
    - get
    - create
    - update
    - patch
    - delete
    - watch
    - updateStatus
    # manage grants full write access to a ServiceConsumer spec. The services
    # controller holds it (so it may keep spec in sync); provider callers do
    # not and are restricted to spec.approval by the validating webhook, which
    # gates on this permission via a SubjectAccessReview.
    - manage
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
