# Compute's assistant registration. Only a Published agent reaches customer
# projects.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceAgent
metadata:
  labels:
    app.kubernetes.io/name: services
    app.kubernetes.io/managed-by: kustomize
  name: compute-diagnostics-agent
spec:
  serviceRef:
    name: compute-miloapis-com
  phase: Published
  displayName: Compute diagnostics
  description: Explains why a workload, deployment, or instance is not running.
