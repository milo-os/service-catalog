# Compute's assistant registration. Only a Published agent reaches customer
# projects.
apiVersion: services.miloapis.com/v1alpha1
kind: ServiceAgent
metadata:
  labels:
    app.kubernetes.io/name: services
    app.kubernetes.io/managed-by: kustomize
  name: compute-diagnostics-agent
spec:
  serviceRef:
    name: compute-miloapis-com
  phase: Published
  displayName: Compute diagnostics
  description: Explains why a workload, deployment, or instance is not running.
  # Leave spec.visibility out: the API defaults it to Required, which reaches
  # only projects entitled to the service. Set visibility.entitlement: None
  # only once the platform owner has added this agent to the services
  # operator's capabilities.entitlementFreeAgents; until then None changes
  # nothing, and the agent's EntitlementWaived condition says so.
