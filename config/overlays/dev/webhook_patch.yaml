---
# Local dev issues the serving cert for the host the kube apiserver dials back
# on, rather than the in-cluster Service DNS name.
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: webhook-cert-patch
patch: |-
  - op: replace
    path: /spec/dnsNames
    value: ["host.docker.internal"]
  - op: replace
    path: /spec/secretName
    value: services-webhook-cert
target:
  kind: Certificate
  group: cert-manager.io
  version: v1
  name: services-serving-cert
---
# In local dev the controller runs on the host, not in-cluster, so every
# webhook must call back to host.docker.internal:9443 instead of the in-cluster
# Service. Entries are keyed by webhook *name* (not list index) so they survive
# webhooks being added or reordered. clientConfig requires exactly one of
# url/service, so the service block is dropped (service: null).
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: mutatingwebhook-url-patch
patch: |-
  apiVersion: admissionregistration.k8s.io/v1
  kind: MutatingWebhookConfiguration
  metadata:
    name: services-mutating
  webhooks:
  - name: mservice.kb.io
    clientConfig:
      url: https://host.docker.internal:9443/mutate-services-miloapis-com-v1alpha1-service
      service: null
target:
  kind: MutatingWebhookConfiguration
---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: validatingwebhook-url-patch
patch: |-
  apiVersion: admissionregistration.k8s.io/v1
  kind: ValidatingWebhookConfiguration
  metadata:
    name: services-validating
  webhooks:
  - name: vservice.kb.io
    clientConfig:
      url: https://host.docker.internal:9443/validate-services-miloapis-com-v1alpha1-service
      service: null
  - name: vserviceavailability.kb.io
    clientConfig:
      url: https://host.docker.internal:9443/validate-services-miloapis-com-v1alpha1-serviceavailability
      service: null
  - name: vserviceconfiguration.kb.io
    clientConfig:
      url: https://host.docker.internal:9443/validate-services-miloapis-com-v1alpha1-serviceconfiguration
      service: null
  - name: vserviceconsumer.kb.io
    clientConfig:
      url: https://host.docker.internal:9443/validate-services-miloapis-com-v1alpha1-serviceconsumer
      service: null
  - name: vserviceentitlement.kb.io
    clientConfig:
      url: https://host.docker.internal:9443/validate-services-miloapis-com-v1alpha1-serviceentitlement
      service: null
target:
  kind: ValidatingWebhookConfiguration
