apiVersion: v1
kind: ServiceAccount
metadata:
  name: services-controller-manager
  labels:
    app.kubernetes.io/name: services
---
apiVersion: v1
kind: Service
metadata:
  name: services-webhook
  labels:
    app.kubernetes.io/name: services
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: services
    app.kubernetes.io/name: services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: services-controller-manager
  labels:
    control-plane: services
    app.kubernetes.io/name: services
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: services
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: services
        app.kubernetes.io/name: services
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: ghcr.io/milo-os/service-catalog-playground-manager:dev
          command:
            - /playground-manager
          args:
            - --consumer-project=demo-project
            - --alias=streamco-platform
            - --enable-webhooks
            - --health-probe-bind-address=:8081
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      serviceAccountName: services-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: webhook-cert
          secret:
            secretName: services-webhook-cert
            defaultMode: 420
            # Optional so a webhookless bring-up (manager arg --enable-webhooks
            # removed) does not wedge on a missing cert Secret.
            optional: true
