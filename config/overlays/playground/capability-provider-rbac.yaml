apiVersion: v1
kind: ServiceAccount
metadata:
  name: capability-provider
  labels:
    app.kubernetes.io/name: capability-provider
---
# The adapter only ever reads AgentBindings (cluster-scoped) to translate them
# into capability documents. It never writes catalog state, so the role is
# read-only and scoped to the one resource it serves.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capability-provider
  labels:
    app.kubernetes.io/name: capability-provider
rules:
  - apiGroups:
      - services.miloapis.com
    resources:
      - agentbindings
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capability-provider
  labels:
    app.kubernetes.io/name: capability-provider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capability-provider
subjects:
  - kind: ServiceAccount
    name: capability-provider
    namespace: agent-framework-playground
