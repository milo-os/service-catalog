apiVersion: apps/v1
kind: Deployment
metadata:
  name: capability-provider
  labels:
    app.kubernetes.io/name: capability-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capability-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capability-provider
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: capability-provider
      containers:
        - name: capability-provider
          image: ghcr.io/milo-os/capability-provider:dev
          command:
            - /capability-provider
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: CONSUMER_PROJECT
              value: "demo-project"
            # Envoy AI Gateway MCPRoute integration. The gateway federates all
            # MCP backends under a SINGLE /mcp endpoint (no per-server suffix)
            # and namespaces tools by a backend prefix. The assistant's dev
            # environment pins the managed Envoy Service name (EnvoyProxy
            # envoyService.name), so the gateway URL is static; catalog-up.sh
            # can still override via MCP_GATEWAY_BASE_URL. Empty base =
            # pass-through (direct endpoints, no gateway).
            - name: MCP_GATEWAY_BASE_URL
              value: "http://patch-ai-gateway.envoy-gateway-system.svc.cluster.local:80/mcp"
            - name: MCP_GATEWAY_APPEND_SERVER_NAME
              value: "false"
            - name: MCP_GATEWAY_TOOL_PREFIX
              value: ""
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: capability-provider
  labels:
    app.kubernetes.io/name: capability-provider
spec:
  selector:
    app.kubernetes.io/name: capability-provider
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
