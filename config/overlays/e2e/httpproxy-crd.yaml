# Minimal, hand-authored CRD for networking.datumapis.com/HTTPProxy.
#
# HTTPProxy is owned by the network-services operator. The HTTPProxy
# entitlement reconciler watches it in every engaged project cluster, so e2e
# needs the CRD installed: without it the informer never syncs and mgr.Start()
# crash-loops (same class of failure as a missing Organization CRD). This
# schema is deliberately permissive — it exists so the watch can sync, not to
# validate HTTPProxy objects.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httpproxies.networking.datumapis.com
spec:
  group: networking.datumapis.com
  scope: Namespaced
  names:
    kind: HTTPProxy
    listKind: HTTPProxyList
    plural: httpproxies
    singular: httpproxy
  versions:
    - name: v1alpha
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
