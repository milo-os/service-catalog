# Minimal, hand-authored CRD for networking.datumapis.com/LocationBinding.
#
# LocationBinding is owned by the network-services operator, not service-catalog
# (the typed Go module is being added to go.miloapis.com/milo in a parallel PR).
# The LocationBindingReconciler writes these objects as unstructured into project
# control planes, so e2e needs the CRD installed without taking a dependency on
# the upstream module. This schema is deliberately permissive (spec accepts
# unknown fields) — it exists to let the API server persist the projection, not
# to validate it; the authoritative schema ships with the upstream CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: locationbindings.networking.datumapis.com
spec:
  group: networking.datumapis.com
  scope: Cluster
  names:
    kind: LocationBinding
    listKind: LocationBindingList
    plural: locationbindings
    singular: locationbinding
  versions:
    - name: v1alpha
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.locationClassName
        - name: Available
          type: string
          jsonPath: .status.conditions[?(@.type=="Available")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
              x-kubernetes-preserve-unknown-fields: true
