# Minimal, hand-authored CRD for networking.datumapis.com/IPClass.
#
# IPClass is owned by the IPAM API, not service-catalog. It is the one kind on
# the platform provisioning allowlist, so e2e needs it installed to exercise the
# projection without depending on the upstream module, as with
# locationbinding-crd.yaml.
#
# It lives beside the single-cluster overlay but is installed into Milo by the
# multi-project environment (hack/e2e-milo/up.sh), which is where the
# provisioning suites now run. Kept in one place rather than copied, so the two
# environments cannot disagree about the fixture's schema.
#
# The schema is permissive: it lets the API server persist a projected
# reference, not validate it. The real IPAM API also authorizes spec.source with
# a subject access review for `use` on the source class, against whoever creates
# the object. This CRD runs no such check, so the e2e suite cannot observe that
# behaviour. See the authorization note in the provisioning reconciler.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ipclasses.networking.datumapis.com
spec:
  group: networking.datumapis.com
  scope: Cluster
  names:
    kind: IPClass
    listKind: IPClassList
    plural: ipclasses
    singular: ipclass
  versions:
    - name: v1alpha
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source Project
          type: string
          jsonPath: .spec.source.project
        - name: Source
          type: string
          jsonPath: .spec.source.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
