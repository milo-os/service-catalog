                  - Published
                  - Deprecated
                  - Retired
                default: Draft
                description: |-
                  Phase is the provider-declared lifecycle state of this meter.
                  Allowed transitions are forward-only:
                  Draft -> Published -> Deprecated -> Retired.
                type: string
            required:
