# Minimal, hand-authored CRD for resourcemanager.miloapis.com/Project.
#
# The Milo multicluster provider (go.miloapis.com/milo/pkg/multicluster-runtime/milo)
# runs a "projectcontrolplane" controller that watches Project to discover which
# project control planes to engage. controller-runtime starts that informer at
# manager startup and blocks on its cache sync; if the Project CRD is absent the
# informer never syncs and, after the cache-sync timeout (~2m), the manager exits
# non-zero and crash-loops — taking the webhook server down with it (every
# admission call then fails with "connection refused").
#
# e2e has no real Milo control plane, so no Projects ever exist; this CRD only
# needs to be registered so the provider's informer can list an empty set and
# sync. The schema is deliberately permissive (spec/status accept unknown
# fields); the authoritative schema ships with the upstream module. Mirrors the
# rationale for the hand-authored LocationBinding CRD in this directory.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.resourcemanager.miloapis.com
spec:
  group: resourcemanager.miloapis.com
  scope: Cluster
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
