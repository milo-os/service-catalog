apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything this environment adds to the published Milo bundle, and nothing
# from it. Kept self-contained so it builds on a clean checkout, where the
# bundle has not been fetched yet.
#
# The composed deployment — this plus the bundle's apiserver and certificate
# components, with the patches in ../patches — is assembled at task time from
# ../root-kustomization.yaml.

namespace: milo-system

resources:
  - namespace.yaml
  - etcd.yaml
  - auth.yaml
