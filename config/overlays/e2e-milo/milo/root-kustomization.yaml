apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The composed Milo deployment: the published bundle plus this environment's
# additions.
#
# NOT named kustomization.yaml on purpose. It only builds inside the staging
# directory `task e2e-milo:setup` assembles, where `bundle/` is the extracted
# OCI artifact; committed as kustomization.yaml it would be a kustomization that
# cannot build on a clean checkout. The self-contained half lives in overlay/.
#
# This is a deliberately small Milo: the apiserver and its storage, and nothing
# else — no controller-manager, no gateway, no audit or tracing sinks, no
# authorization provider. Project control-plane paths serve without any of them,
# which is all these suites need. Upstream's own overlays/test-infra pulls all
# of it in, which is why this composes the bundle's pieces rather than consuming
# that overlay.
#
# Project.status.Ready is set by the bootstrap rather than by a controller,
# because the controller-manager is not deployed. See test/e2e-milo/README.md.

namespace: milo-system

resources:
  - bundle/apiserver
  - overlay

components:
  # The CA everything here chains to: a selfSigned Issuer, a CA Certificate, and
  # a CA Issuer that signs from it.
  - bundle/components/certificates
  # Milo's serving certificate, issued by that CA. Upstream keeps it in its
  # test-infra overlay rather than in a shared component, but it is a plain
  # Certificate for milo-apiserver.milo-system.svc with no other coupling to
  # that overlay, so it is taken as-is instead of re-vendored.
  - bundle/overlays/test-infra/components/certificates

# Pulled from ghcr by digest, not by the bundle's own tag: the tag identifies
# the release, but a tag can be republished. The tag is recorded for legibility.
# Update it, the digest, and MILO_BUNDLE_TAG in the Taskfile together — this and
# the bundle must name the same Milo version, or the manifests and the binary
# they configure have drifted.
#
# This is an index digest, so the node resolves its own platform.
images:
  - name: ghcr.io/milo-os/milo
    newName: ghcr.io/milo-os/milo
    # tag v0.32.5
    digest: sha256:3b4f2890491220c4c79731d9e9b350881ce15dcca9de15b9f511cd7e5323f609

patches:
  - path: patches/apiserver-patch.yaml
    target:
      kind: Deployment
      name: milo-apiserver
  - path: patches/service-nodeport-patch.yaml
    target:
      kind: Service
      name: milo-apiserver
