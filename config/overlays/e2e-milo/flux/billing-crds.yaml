# The same published billing artifact, at the same tag, installed the same way
# as config/overlays/e2e/billing-crds.yaml.
#
# Only the destination differs. There the CRDs land in the hosting cluster,
# where the operator's single-cluster mode resolves every project. Here they
# land in Milo, so this Kustomization carries a kubeConfig: the hosting cluster
# serves no catalog API.
#
# It installs the whole CRD set, not the two kinds the suites name.
# ServiceEntitlementReconciler indexes BillingAccountBinding and
# BillingEntitlement at startup, and the manager exits if either is not served.
# Naming files individually is how this environment first failed: the set grows
# in the billing repo, and a list goes stale silently.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: billing
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/milo-os/billing-kustomize
  # The same floating tag config/overlays/e2e uses. The two environments install
  # one artifact, and pinning this one further would let them drift silently.
  ref:
    tag: v0.0.0-main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: billing-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 10s
  timeout: 5m
  # Ready therefore means the CRDs are Established, which is what the operator
  # is waiting on: it exits at startup if a kind it indexes is not yet served.
  wait: true
  sourceRef:
    kind: OCIRepository
    name: billing
  path: ./base/crd/bases
  prune: false
  # Written by hack/e2e-milo/up.sh once Milo is serving.
  kubeConfig:
    secretRef:
      name: milo-kubeconfig
