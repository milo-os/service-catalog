# The same published billing artifact, at the same tag, that
# config/overlays/e2e/billing-crds.yaml installs — and installed the same way.
#
# The one difference is where it lands. There the CRDs belong in the hosting
# cluster, because that is where the operator's single-cluster mode resolves
# every project. Here they belong in Milo, so this Kustomization is pointed at
# it with a kubeConfig: the hosting cluster serves no catalog API at all.
#
# The whole CRD set is installed, not the two kinds the suites name:
# ServiceEntitlementReconciler indexes BillingAccountBinding and
# BillingEntitlement at startup and the manager exits if either is not served.
# Naming files individually is how this environment first failed — the set grows
# in the billing repo, and a list goes stale silently.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: billing
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/milo-os/billing-kustomize
  # Deliberately the same floating tag config/overlays/e2e uses: the two
  # environments install one artifact, and pinning this one further would let
  # them drift silently.
  ref:
    tag: v0.0.0-main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: billing-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 10s
  timeout: 5m
  # Ready therefore means the CRDs are Established, which is what the operator
  # is waiting on: it exits at startup if a kind it indexes is not yet served.
  wait: true
  sourceRef:
    kind: OCIRepository
    name: billing
  path: ./base/crd/bases
  prune: false
  # Written by hack/e2e-milo/up.sh once Milo is serving.
  kubeConfig:
    secretRef:
      name: milo-kubeconfig
