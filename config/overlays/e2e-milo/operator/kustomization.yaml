apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The operator, running in the kind cluster but serving no API of its own there.
#
# Everything it reads and writes lives in Milo, reached over the kubeconfig in
# milo-kubeconfig.yaml. Nothing in this kustomization is a CRD or a webhook
# configuration: those are cluster-scoped API surface and belong to the control
# plane that serves them, which is Milo — see ../milo-resources.
#
# The single-cluster e2e provider is deliberately NOT set here. That is the
# whole point of this environment: the Milo multicluster provider discovers real
# Projects and engages each one's control plane separately.

namespace: services-system

resources:
  - namespace.yaml
  - milo-kubeconfig.yaml
  - ../../../base/manager
  - ../../../base/certmanager

images:
  - name: ghcr.io/milo-os/service-catalog
    newTag: dev

patches:
  - path: manager-patch.yaml
    target:
      kind: Deployment
      name: services-controller-manager

configMapGenerator:
  - name: services-config
    behavior: replace
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true

transformers:
  - cert-dnsnames-patch.yaml
