apiVersion: apiserver.config.miloapis.com/v1alpha1
kind: ServicesOperator
metricsServer:
  bindAddress: "0"
webhookServer: {}
# The operator's API surface is Milo's, not the hosting cluster's. Without this
# it would fall back to the in-cluster config and find none of the services
# types. The kubeconfig is created by the environment bootstrap.
kubeconfigPath: /etc/milo/kubeconfig
# Consumer-scoped projection stays off, as in config/overlays/e2e. It is a
# separate capability with its own gating, and enabling it would move
# LocationBinding projection to another manager without covering what this
# environment proves.
# CRM contact-group enrollment is on, at the default namespace ("milo-system"),
# so test/e2e-milo/contact-enrollment can exercise ContactEnrollmentReconciler
# against Milo's real notification.miloapis.com API — the one thing this
# feature actually talks to that a fake client can't stand in for.
contactEnrollment: {}
