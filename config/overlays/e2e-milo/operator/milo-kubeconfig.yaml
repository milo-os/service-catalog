# The operator's access to Milo, committed rather than generated: the server is
# a cluster DNS name, the identity is the static token
# ../milo/auth.yaml installs, and TLS verification is skipped — nothing here is
# discovered at run time.
#
# The identity is the operator's own rather than the bootstrap's. In production
# it reaches project control planes with system:masters, which is why
# ProvisioningReconciler re-checks the allowlist in code rather than relying on
# RBAC to bound it; see ../milo/auth.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: milo-kubeconfig
  namespace: services-system
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    current-context: milo
    clusters:
      - name: milo
        cluster:
          server: https://milo-apiserver.milo-system.svc.cluster.local:6443
          insecure-skip-tls-verify: true
    users:
      - name: services-operator
        user:
          token: e2e-milo-operator-token
    contexts:
      - name: milo
        context: {cluster: milo, user: services-operator}
