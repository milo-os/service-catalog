---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Platform
  name: serviceavailabilities.services.miloapis.com
spec:
  group: services.miloapis.com
  names:
    kind: ServiceAvailability
    listKind: ServiceAvailabilityList
    plural: serviceavailabilities
    singular: serviceavailability
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceRef.name
      name: Service
      type: string
    - jsonPath: .spec.locationRef.name
      name: Location
      type: string
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceAvailability is the Schema for the serviceavailabilities API. It
          is the third gate in the location three-gate model: it asserts that a
          service is deployed and operational at a specific Location, decoupled
          from the Location's own hardware readiness.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServiceAvailabilitySpec defines the desired state of a
              ServiceAvailability.

              A ServiceAvailability records that a specific service is deployed and
              validated at a specific Location. It decouples "the PoP exists and
              hardware is Ready" (a Location concern) from "this service is
              operational here" (a service-operator concern). Each service operator
              creates a ServiceAvailability when it completes deployment and health
              checks at a Location; the LocationBindingReconciler reads it as the
              third gate when deciding which locations to project into entitled
              projects.

              Both serviceRef and locationRef are immutable: a ServiceAvailability
              records availability for one (service, location) pair for its entire
              lifetime. Re-pointing it would silently rewrite that meaning, so a new
              pairing ships as a new object instead.
            properties:
              locationRef:
                description: |-
                  LocationRef identifies the platform Location this availability record
                  applies to. Immutable.
                properties:
                  name:
                    description: Name is the metadata.name of the referenced Location.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referenced Location in the platform
                      control plane.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: locationRef is immutable
                  rule: self == oldSelf
              serviceRef:
                description: |-
                  ServiceRef identifies the Service this availability record applies
                  to by metadata.name. Immutable.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: serviceRef is immutable
                  rule: self == oldSelf
            required:
            - locationRef
            - serviceRef
            type: object
          status:
            description: |-
              ServiceAvailabilityStatus defines the observed state of a
              ServiceAvailability. The reconciler owns the Available condition: it is
              True when the service operator reports the service deployed and validated
              at the location.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  availability's state. The Available condition is the gate the
                  LocationBindingReconciler reads.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
