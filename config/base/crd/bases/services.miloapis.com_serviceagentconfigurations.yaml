---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Platform
  name: serviceagentconfigurations.services.miloapis.com
spec:
  group: services.miloapis.com
  names:
    kind: ServiceAgentConfiguration
    listKind: ServiceAgentConfigurationList
    plural: serviceagentconfigurations
    singular: serviceagentconfiguration
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceAgentRef.name
      name: Agent
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceAgentConfiguration is the Schema for the
          serviceagentconfigurations API. It is the versioned provider-facing
          document declaring an agent's knowledge, tools, authority, and usage
          metrics. metadata.name conventionally carries the agent slug plus a
          version suffix (e.g. "streamco-streaming-agent-v1") to make the
          versioning obvious at a glance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServiceAgentConfigurationSpec defines the desired state of a
              ServiceAgentConfiguration.

              A ServiceAgentConfiguration is the single provider-facing document
              that describes everything a ServiceAgent contributes beyond its
              identity record: the knowledge sources the assistant may ground on,
              the MCP tools it may call, the authority envelope it operates under,
              and the usage metrics it emits. Documents are versioned by creating
              new resources; the LATEST Published configuration for an agent is the
              active one (the same selection approach LocationBinding takes for
              ServiceConfiguration).

              spec.phase is the provider-declared lifecycle intent:
              Draft -> Published -> Deprecated -> Retired. Draft documents are
              never projected to consumers. The controller mirrors that intent via
              conditions; it does not transition the phase itself.
            properties:
              authority:
                description: |-
                  Authority declares the envelope the agent operates under on
                  behalf of a consumer: which Kinds it may read and how long a
                  single task may run.
                properties:
                  maxTaskDurationSeconds:
                    description: |-
                      MaxTaskDurationSeconds bounds how long a single agent task may
                      run.
                    format: int64
                    minimum: 0
                    type: integer
                  reads:
                    description: |-
                      Reads lists the Kubernetes Kinds the agent may read in the
                      consumer project. Kind may be "*" to allow every Kind in the
                      group.
                    items:
                      description: |-
                        AgentReadAuthority grants read access to one Kubernetes Kind (or a
                        whole group via kind "*").
                      properties:
                        gvk:
                          description: |-
                            GVK identifies the readable Kind. Version is deliberately
                            omitted; kind may be "*".
                          properties:
                            group:
                              description: |-
                                Group is the Kubernetes API group of the Kind (e.g.
                                "compute.miloapis.com").
                              maxLength: 253
                              minLength: 1
                              type: string
                            kind:
                              description: Kind is the Kubernetes Kind (e.g. "Instance").
                              maxLength: 63
                              minLength: 1
                              type: string
                          required:
                          - group
                          - kind
                          type: object
                      required:
                      - gvk
                      type: object
                    maxItems: 64
                    type: array
                type: object
              delegation:
                description: Delegation declares the Tier 3 agent-to-agent delegation
                  surface.
                properties:
                  a2a:
                    description: A2A declares the A2A agent card for delegation discovery.
                    properties:
                      agentCardUrl:
                        description: AgentCardURL is where the agent-card.json document
                          is served.
                        maxLength: 2048
                        minLength: 1
                        type: string
                      skills:
                        description: Skills lists the skill identifiers the agent
                          advertises.
                        items:
                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: set
                    required:
                    - agentCardUrl
                    type: object
                type: object
              knowledge:
                description: |-
                  Knowledge declares the Tier 1 grounding material for the agent:
                  documents the assistant may fetch and concepts it should know.
                properties:
                  concepts:
                    description: |-
                      Concepts lists the Kubernetes Kinds the agent should understand,
                      each with a short summary.
                    items:
                      description: |-
                        AgentConcept ties a Kubernetes Kind to a short summary the agent can
                        ground on.
                      properties:
                        gvk:
                          description: |-
                            GVK pins the concept to a Kubernetes Kind. Version is
                            deliberately omitted, mirroring MonitoredResourceTypeSpec.
                          properties:
                            group:
                              description: |-
                                Group is the Kubernetes API group of the Kind (e.g.
                                "compute.miloapis.com").
                              maxLength: 253
                              minLength: 1
                              type: string
                            kind:
                              description: Kind is the Kubernetes Kind (e.g. "Instance").
                              maxLength: 63
                              minLength: 1
                              type: string
                          required:
                          - group
                          - kind
                          type: object
                        summary:
                          description: Summary is a plain-English explanation of the
                            Kind.
                          maxLength: 1024
                          minLength: 1
                          type: string
                      required:
                      - gvk
                      - summary
                      type: object
                    maxItems: 64
                    type: array
                  sources:
                    description: |-
                      Sources lists documents the assistant may fetch and append to its
                      context, labeled with provenance.
                    items:
                      description: AgentKnowledgeSource is a single fetchable knowledge
                        document.
                      properties:
                        title:
                          description: Title is an optional human-readable label for
                            the document.
                          maxLength: 128
                          type: string
                        type:
                          description: Type classifies the document.
                          enum:
                          - LLMDocs
                          - Runbook
                          - Markdown
                          type: string
                        url:
                          description: URL is where the document is served from.
                          maxLength: 2048
                          minLength: 1
                          type: string
                      required:
                      - type
                      - url
                      type: object
                    maxItems: 64
                    type: array
                type: object
              metrics:
                description: |-
                  Metrics declares metric descriptors for agent usage (e.g. tool
                  invocations). Entries mirror ServiceConfiguration.spec.metrics and
                  must be prefixed by the owning Service's canonical serviceName.
                items:
                  description: MetricSpec is a single metric descriptor declared by
                    a ServiceConfiguration.
                  properties:
                    description:
                      description: Description is a plain-English explanation of what
                        the metric measures.
                      maxLength: 1024
                      type: string
                    displayName:
                      description: DisplayName is a human-readable label shown in
                        portals and invoices.
                      maxLength: 128
                      type: string
                    kind:
                      description: Kind is the metric kind. Immutable once Published.
                      enum:
                      - Delta
                      - Gauge
                      - Cumulative
                      type: string
                    name:
                      description: |-
                        Name is the canonical metric identifier prefixed by the service name,
                        e.g. "compute.datumapis.com/instance/cpu-seconds". Immutable once Published.
                      maxLength: 253
                      minLength: 1
                      type: string
                    unit:
                      description: |-
                        Unit is the UCUM emission unit, e.g. "s", "By", "{request}", "1".
                        This is the unit the producer emits. Immutable once Published.
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - name
                  - unit
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              phase:
                allOf:
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                default: Draft
                description: |-
                  Phase is the provider-declared lifecycle state of this
                  configuration. Allowed transitions are forward-only:
                  Draft -> Published -> Deprecated -> Retired.
                type: string
              serviceAgentRef:
                description: |-
                  ServiceAgentRef points at the ServiceAgent this document
                  configures, by metadata.name of the cluster-scoped ServiceAgent
                  resource.
                properties:
                  name:
                    description: |-
                      Name is the metadata.name of the cluster-scoped ServiceAgent
                      resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              tools:
                description: Tools declares the Tier 2 MCP tool surface for the agent.
                properties:
                  mcpServers:
                    description: |-
                      MCPServers lists the MCP servers the assistant may connect to on
                      the consumer's behalf. Entries are keyed by .name, which must be
                      unique within the document.
                    items:
                      description: |-
                        AgentMCPServer declares one MCP server endpoint and the allow-listed
                        tools it exposes.
                      properties:
                        endpoint:
                          description: Endpoint is the Streamable HTTP endpoint of
                            the MCP server.
                          maxLength: 2048
                          minLength: 1
                          type: string
                        mutating:
                          description: |-
                            Mutating lists the subset of included tools that mutate state.
                            Downstream policy may require confirmation before invoking them.
                          items:
                            type: string
                          maxItems: 64
                          type: array
                          x-kubernetes-list-type: set
                        name:
                          description: |-
                            Name is a short DNS-label identifier for the server. Downstream
                            consumers namespace exposed tools as "<name>__<tool>".
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        toolSelector:
                          description: |-
                            ToolSelector allow-lists the tools consumers may call. Tools not
                            in the include list are never exposed, regardless of what the
                            server advertises.
                          properties:
                            include:
                              description: Include lists the tool names to expose.
                              items:
                                type: string
                              maxItems: 64
                              type: array
                              x-kubernetes-list-type: set
                          type: object
                      required:
                      - endpoint
                      - name
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              version:
                description: |-
                  Version is an optional human-readable version string for this
                  configuration document (e.g. "v1", "2024-01-15"). It has no
                  semantic meaning to the controller and is surfaced as a table
                  column and on projected AgentBindings for operator convenience.
                maxLength: 64
                type: string
            required:
            - phase
            - serviceAgentRef
            type: object
          status:
            description: |-
              ServiceAgentConfigurationStatus defines the observed state of a
              ServiceAgentConfiguration.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              publishedAt:
                description: |-
                  PublishedAt is the time at which the controller first observed
                  the resource in the Published phase. It is preserved across
                  later transitions to Deprecated and Retired so downstream systems
                  can reason about how long the resource has been part of the
                  catalog.
                format: date-time
                type: string
              serviceName:
                description: |-
                  ServiceName is the resolved canonical reverse-DNS name of the
                  Service backing the referenced ServiceAgent (e.g.
                  "streaming.streamco.example"). Populated by the controller after
                  the serviceAgentRef chain is successfully resolved.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
