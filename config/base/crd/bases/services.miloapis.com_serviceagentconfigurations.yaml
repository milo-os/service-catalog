---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Platform
  name: serviceagentconfigurations.services.miloapis.com
spec:
  group: services.miloapis.com
  names:
    kind: ServiceAgentConfiguration
    listKind: ServiceAgentConfigurationList
    plural: serviceagentconfigurations
    singular: serviceagentconfiguration
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceAgentRef.name
      name: Agent
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceAgentConfiguration is one reviewed version of what a ServiceAgent
          offers. Name it after the agent plus a version suffix (for example
          "compute-diagnostics-agent-v1") so versions are obvious at a glance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServiceAgentConfigurationSpec is the reviewed content a ServiceAgent
              contributes: documents the assistant may read, tools it may call, guides it
              may follow, and the limits it works within. New versions ship as new objects;
              the latest Published one is the one customers get.

              The field names below are copied verbatim into the CapabilityBinding written
              into each customer's project, so the JSON tags must stay in step with the
              assistant's own schema. Renaming one here does not break any build — it just
              stops that piece of content from ever reaching a customer.
            properties:
              authority:
                description: Authority is what the assistant may look at and for how
                  long.
                properties:
                  maxTaskDurationSeconds:
                    description: |-
                      MaxTaskDurationSeconds caps how long one task using this service's tools
                      may run. Leave it unset to use the assistant's own default.
                    format: int64
                    minimum: 1
                    type: integer
                  reads:
                    description: |-
                      Reads are the resource kinds the assistant may read in a customer's
                      project. Reads happen as the person asking, so this grants no access
                      they do not already have. Kind may be "*" for every kind in the group.
                    items:
                      description: AgentReadAuthority is one readable resource kind.
                      properties:
                        gvk:
                          description: |-
                            GVKRef identifies a Kubernetes Kind by group and kind. Version is
                            intentionally excluded so API version evolution does not require a
                            new monitored resource type entry.
                          properties:
                            group:
                              description: |-
                                Group is the Kubernetes API group of the Kind (e.g.
                                "compute.miloapis.com").
                              maxLength: 253
                              minLength: 1
                              type: string
                            kind:
                              description: Kind is the Kubernetes Kind (e.g. "Instance").
                              maxLength: 63
                              minLength: 1
                              type: string
                          required:
                          - group
                          - kind
                          type: object
                      required:
                      - gvk
                      type: object
                    maxItems: 64
                    type: array
                type: object
              knowledge:
                description: Knowledge is what the assistant may read about this service.
                properties:
                  concepts:
                    description: |-
                      Concepts are short explanations of this service's resources, so basic
                      questions can be answered without fetching anything.
                    items:
                      description: AgentConcept is a short explanation of one resource
                        kind.
                      properties:
                        gvk:
                          description: |-
                            GVKRef identifies a Kubernetes Kind by group and kind. Version is
                            intentionally excluded so API version evolution does not require a
                            new monitored resource type entry.
                          properties:
                            group:
                              description: |-
                                Group is the Kubernetes API group of the Kind (e.g.
                                "compute.miloapis.com").
                              maxLength: 253
                              minLength: 1
                              type: string
                            kind:
                              description: Kind is the Kubernetes Kind (e.g. "Instance").
                              maxLength: 63
                              minLength: 1
                              type: string
                          required:
                          - group
                          - kind
                          type: object
                        summary:
                          maxLength: 1024
                          minLength: 1
                          type: string
                      required:
                      - gvk
                      - summary
                      type: object
                    maxItems: 64
                    type: array
                  sources:
                    description: |-
                      Sources are documents the assistant fetches when it needs them. An
                      unreachable one is skipped, not an error.
                    items:
                      description: AgentKnowledgeSource is one fetchable document.
                      properties:
                        title:
                          description: Title is how the document is credited when
                            its text is used.
                          maxLength: 128
                          type: string
                        type:
                          description: AgentKnowledgeSourceType says what kind of
                            document a knowledge source is.
                          enum:
                          - LLMDocs
                          - Runbook
                          - Markdown
                          type: string
                        url:
                          maxLength: 2048
                          minLength: 1
                          type: string
                      required:
                      - type
                      - url
                      type: object
                    maxItems: 64
                    type: array
                type: object
              phase:
                allOf:
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                default: Draft
                description: |-
                  Phase is how far along the provider says this document is. Only
                  Published documents reach customer projects.
                type: string
              reportingProject:
                description: |-
                  ReportingProject is the provider's own Milo project, where their team
                  reads reports of things the assistant could not do. Leave it empty and
                  those reports have nowhere to go — the assistant simply stops offering
                  to file them.
                maxLength: 253
                type: string
              serviceAgentRef:
                description: ServiceAgentRef is the ServiceAgent this document configures.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              skills:
                description: |-
                  Skills are step-by-step guides the assistant may follow. Only the name
                  and description are shown to it; the guide itself is fetched when it
                  looks relevant, so publishing many of them costs almost nothing.
                items:
                  description: |-
                    AgentSkill is one step-by-step guide the assistant may follow. It grants
                    nothing on its own — it can only point at tools that are already approved.
                  properties:
                    description:
                      description: |-
                        Description is the one line the assistant sees, and the only thing it
                        can match a request against. A guide nobody can pick is wasted.
                      maxLength: 1024
                      minLength: 1
                      type: string
                    name:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    source:
                      description: Source is where the guide itself is served from.
                      maxLength: 2048
                      minLength: 1
                      type: string
                  required:
                  - description
                  - name
                  - source
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              tools:
                description: Tools is what the assistant may call.
                properties:
                  mcpServers:
                    description: MCPServers are the tool servers the assistant may
                      connect to.
                    items:
                      description: AgentMCPServer is one tool server and the tools
                        approved on it.
                      properties:
                        endpoint:
                          description: |-
                            Endpoint is the server's address. In production this must point at the
                            AI gateway: a call sent straight to the service is not billed, does not
                            carry the customer's identity, and is refused.
                          maxLength: 2048
                          minLength: 1
                          type: string
                        mutating:
                          description: |-
                            Mutating names the approved tools that change a customer's resources,
                            so the assistant asks before using them. Leaving one out of this list
                            means it can be used without asking.
                          items:
                            type: string
                          maxItems: 64
                          type: array
                          x-kubernetes-list-type: set
                        name:
                          description: |-
                            Name prefixes this server's tools as "<name>__<tool>", so two providers
                            can offer a tool of the same name without clashing.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        toolSelector:
                          description: |-
                            ToolSelector is the approved list of tools. Anything not named there is
                            never offered to the assistant, even if the server serves it.
                          properties:
                            include:
                              description: |-
                                Include is the approved list. An empty list means no tools from this
                                server, never "all of them".
                              items:
                                type: string
                              maxItems: 64
                              type: array
                              x-kubernetes-list-type: set
                          type: object
                      required:
                      - endpoint
                      - name
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              version:
                description: |-
                  Version is the provider's own stamp for this content (e.g. "v1"). It is
                  copied onto every projected binding and is how we tell which content a
                  customer actually saw, so it must not be blank.
                maxLength: 64
                minLength: 1
                type: string
            required:
            - phase
            - serviceAgentRef
            - version
            type: object
          status:
            description: |-
              ServiceAgentConfigurationStatus is the observed state of a
              ServiceAgentConfiguration.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              publishedAt:
                description: |-
                  PublishedAt is the time at which the controller first observed
                  the resource in the Published phase. It is preserved across
                  later transitions to Deprecated and Retired so downstream systems
                  can reason about how long the resource has been part of the
                  catalog.
                format: date-time
                type: string
              serviceName:
                description: |-
                  ServiceName is the service's full name, resolved through the referenced
                  agent. Tool usage is billed against it.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
