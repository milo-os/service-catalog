---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Project
  name: serviceentitlements.services.miloapis.com
spec:
  group: services.miloapis.com
  names:
    kind: ServiceEntitlement
    listKind: ServiceEntitlementList
    plural: serviceentitlements
    singular: serviceentitlement
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.serviceName
      name: Service
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.origin
      name: Origin
      type: string
    - jsonPath: .status.conditions[?(@.type=="Suspended")].status
      name: Suspended
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceEntitlement is the Schema for the serviceentitlements API. A consumer
          project admin creates one ServiceEntitlement per service they want to use.
          The object is written into the consumer project's virtual control plane and
          the services operator reconciles it into the provider project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServiceEntitlementSpec defines the desired state of a ServiceEntitlement.
            properties:
              requestMessage:
                description: |-
                  RequestMessage is an optional human-readable message sent to the
                  provider when the service requires GatedByProvider approval.
                maxLength: 1024
                type: string
              serviceRef:
                description: ServiceRef identifies the Service the consumer project
                  wants to enable.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - serviceRef
            type: object
          status:
            description: ServiceEntitlementStatus defines the observed state of a
              ServiceEntitlement.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  entitlement's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dependencyOf:
                description: |-
                  DependencyOf is the metadata.name of the ServiceEntitlement that caused
                  this entitlement to be created when origin is Dependency.
                type: string
              entitledAt:
                description: EntitledAt is the time at which this entitlement became
                  Active.
                format: date-time
                type: string
              lastProvisioningEvaluation:
                description: |-
                  LastProvisioningEvaluation is when provisioning was last evaluated for
                  this entitlement, successfully or not.

                  A fan-out that has silently stopped is otherwise indistinguishable from a
                  project that legitimately has nothing. Location projection stopped in
                  staging once and surfaced weeks later as a downstream symptom in an
                  unrelated component.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              origin:
                description: |-
                  Origin indicates whether this entitlement was created directly by a
                  consumer admin or automatically as a dependency of another entitlement.
                enum:
                - Direct
                - Dependency
                type: string
              phase:
                description: Phase is the controller-observed lifecycle state of this
                  entitlement.
                enum:
                - PendingApproval
                - Active
                - Rejected
                type: string
              provisionedResources:
                description: |-
                  ProvisionedResources is the per-resource delivery ledger for the
                  service's spec.provisioning declaration.
                items:
                  description: |-
                    ProvisionedResourceStatus is the per-resource ledger entry for one
                    declaration, in the consumer's own control plane.
                  properties:
                    authorizationEstablished:
                      description: |-
                        AuthorizationEstablished reports whether the platform established the
                        consumer project's own authorization to use the referenced source
                        objects, where the target API performs its own permission check.

                        False means the objects work on the installing identity's authority, not
                        the consumer's. This version establishes no such grant for any kind, so
                        it is always false. It stays reported rather than removed: the gap is the
                        honest limit of this version, and a consumer reading the ledger has to be
                        able to see it.
                      type: boolean
                    kinds:
                      description: |-
                        Kinds are the group, version, and kind of everything this declaration
                        installed in this project. It is the entitlement's own record, so teardown
                        does not depend on the declaration still being there to say what it wrote
                        — a withdrawn declaration says nothing at all.
                      items:
                        description: |-
                          ProvisionedKindRef is a group, version, and kind recorded on the ledger.

                          The version is here because teardown reads and deletes, and both happen at a
                          version. It is the provider's version, since the platform does not own the
                          API.
                        properties:
                          group:
                            description: Group is the API group of the kind (e.g.
                              "ipam.miloapis.com").
                            maxLength: 253
                            type: string
                          kind:
                            description: Kind is the Kubernetes Kind (e.g. "IPClass").
                            maxLength: 63
                            type: string
                          version:
                            description: Version is the API version the object was
                              written at (e.g. "v1alpha1").
                            maxLength: 63
                            type: string
                        required:
                        - kind
                        - version
                        type: object
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: atomic
                    message:
                      description: |-
                        Message names the service, the resource, and what a consumer can act on
                        or escalate with. A generic apply error is not an acceptable value here.
                      maxLength: 1024
                      type: string
                    name:
                      description: Name is the declaration's spec.provisioning.resources[].name.
                      type: string
                    objectCount:
                      description: |-
                        ObjectCount is how many objects this declaration resolved to and
                        installed.
                      format: int32
                      type: integer
                    reason:
                      description: Reason is a machine-readable cause, set when State
                        is not Installed.
                      type: string
                    state:
                      description: State is the delivery outcome for this declaration.
                      enum:
                      - Installed
                      - Failed
                      - Unprovisionable
                      type: string
                  required:
                  - name
                  - state
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              serviceName:
                description: |-
                  ServiceName is the canonical service identifier resolved from
                  spec.serviceRef, e.g. "compute.datumapis.com". Set by the controller
                  on first successful reconcile so consumers can always read the
                  canonical name regardless of what was written to spec.serviceRef.name.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
