---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Platform
  name: serviceagents.services.miloapis.com
spec:
  group: services.miloapis.com
  names:
    kind: ServiceAgent
    listKind: ServiceAgentList
    plural: serviceagents
    singular: serviceagent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceRef.name
      name: Service
      type: string
    - jsonPath: .spec.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceAgent is the Schema for the serviceagents API. It is the
          platform-owned identity record for an AI agent capability offered by
          a Service on Milo. Versioned agent behavior (knowledge, tools,
          authority, metrics) is declared on ServiceAgentConfiguration
          documents that reference this agent; consumer projects receive the
          projection via AgentBinding.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServiceAgentSpec defines the desired state of a ServiceAgent.

              A ServiceAgent is the identity record for an AI agent capability a
              provider offers alongside a Service. Like Service, it is identity
              only: what the agent knows and which tools it may call live on
              versioned ServiceAgentConfiguration documents, never here.

              spec.phase is the provider-declared lifecycle intent: Draft ->
              Published -> Deprecated -> Retired. The controller reflects that
              declaration via conditions on status; it does not transition the
              phase itself.
            properties:
              description:
                description: |-
                  Description is a plain-English explanation of what the agent can
                  help with. Editable over the agent's lifetime.
                maxLength: 1024
                type: string
              displayName:
                description: |-
                  DisplayName is a human-readable name surfaced in the portal and
                  assistant UI alongside the owning service. Editable over the
                  agent's lifetime.
                maxLength: 128
                minLength: 1
                type: string
              phase:
                allOf:
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                default: Draft
                description: |-
                  Phase is the provider-declared lifecycle state of this agent.
                  Allowed transitions are forward-only:
                  Draft -> Published -> Deprecated -> Retired.
                type: string
              serviceRef:
                description: |-
                  ServiceRef points at the Service this agent belongs to, by
                  metadata.name of the cluster-scoped Service resource. Immutable:
                  an agent cannot be re-homed to a different service; ship a new
                  ServiceAgent instead.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: serviceRef is immutable
                  rule: self == oldSelf
            required:
            - displayName
            - phase
            - serviceRef
            type: object
          status:
            description: ServiceAgentStatus defines the observed state of a ServiceAgent.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              publishedAt:
                description: |-
                  PublishedAt is the time at which the controller first observed
                  the resource in the Published phase. It is preserved across
                  later transitions to Deprecated and Retired so downstream systems
                  can reason about how long the resource has been part of the
                  catalog.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
