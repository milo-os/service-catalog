---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Platform
  name: serviceagents.services.miloapis.com
spec:
  group: services.miloapis.com
  names:
    kind: ServiceAgent
    listKind: ServiceAgentList
    plural: serviceagents
    singular: serviceagent
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceRef.name
      name: Service
      type: string
    - jsonPath: .spec.phase
      name: Phase
      type: string
    - jsonPath: .spec.visibility.entitlement
      name: Entitlement
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceAgent is a provider's agent registration for one Service. The
          projection controller turns a Published agent plus its latest Published
          configuration into a CapabilityBinding in every entitled customer project,
          or in every project when spec.visibility.entitlement is None and the
          platform owner has allowlisted the agent.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServiceAgentSpec is a provider's registration of the AI-assistant help it
              offers alongside a Service. It is identity only: what the assistant actually
              knows and may call lives on ServiceAgentConfiguration documents.
            properties:
              description:
                description: Description is a plain-English note on what the agent
                  can help with.
                maxLength: 1024
                type: string
              displayName:
                description: DisplayName is the name people see in the portal.
                maxLength: 128
                minLength: 1
                type: string
              phase:
                allOf:
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                default: Draft
                description: |-
                  Phase is how far along the provider says this agent is. Only Published
                  agents reach customer projects; anything else is invisible to them.
                type: string
              serviceRef:
                description: |-
                  ServiceRef is the Service this agent belongs to, by metadata.name.
                  Immutable — an agent cannot be moved to another service; register a new
                  one instead.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: serviceRef is immutable
                  rule: self == oldSelf
              visibility:
                default: {}
                description: |-
                  Visibility asks which customer projects this agent reaches. Omitted, it
                  means what it always has: only projects entitled to the service.
                properties:
                  entitlement:
                    default: Required
                    description: |-
                      Entitlement controls project-level gating: "Required" means a project
                      must have an Active ServiceEntitlement for this service before its
                      assistant is given this agent; "None" asks for every project's
                      assistant to be given it, existing and new, with no entitlement step
                      (see milo-os/service-catalog#93). Defaults to "Required".

                      "None" is a request, not a grant. Which services are platform-wide is
                      the platform owner's decision, so it takes effect only when this
                      agent's name is in the services operator's
                      capabilities.entitlementFreeAgents allowlist, which providers cannot
                      write. Until then the agent is gated on entitlement as if it said
                      "Required", and its EntitlementWaived condition says why.

                      Phase and configuration gates still apply: the agent must be
                      Published, its Service must be Published, and it must have a Published
                      ServiceAgentConfiguration.

                      Where the operator runs with consumer-scoped projection, it writes only
                      into the projects it has engaged as consumers of its own services, so
                      "None" reaches every one of those, not every project on the platform.
                    enum:
                    - Required
                    - None
                    type: string
                type: object
            required:
            - displayName
            - phase
            - serviceRef
            type: object
          status:
            description: ServiceAgentStatus is the observed state of a ServiceAgent.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              publishedAt:
                description: |-
                  PublishedAt is the time at which the controller first observed
                  the resource in the Published phase. It is preserved across
                  later transitions to Deprecated and Retired so downstream systems
                  can reason about how long the resource has been part of the
                  catalog.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
