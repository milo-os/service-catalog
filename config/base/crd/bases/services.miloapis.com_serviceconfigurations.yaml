---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    discovery.miloapis.com/parent-contexts: Platform
  name: serviceconfigurations.services.miloapis.com
spec:
  group: services.miloapis.com
  names:
    kind: ServiceConfiguration
    listKind: ServiceConfigurationList
    plural: serviceconfigurations
    singular: serviceconfiguration
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.serviceName
      name: Service
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceConfiguration is the Schema for the serviceconfigurations API.
          It is the single provider-facing document that declares everything a
          service contributes to Milo beyond its identity record. metadata.name
          is conventionally the service's reverse-DNS slug (e.g.
          "compute-miloapis-com") to make the 1:1 relationship between Service
          and ServiceConfiguration obvious at a glance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServiceConfigurationSpec defines the desired state of a
              ServiceConfiguration.

              A ServiceConfiguration is the single provider-facing document that
              describes everything a service contributes to Milo beyond its identity
              record: its monitored resource types (the Kubernetes Kinds billing and
              dashboards know about) and its meters (the billable dimensions those
              Kinds emit). The services operator fans this document out into the
              downstream CRDs consumed by billing; providers never author those
              directly.

              Canonical names on meters and monitored resource types must still be
              prefixed by the referenced service's spec.serviceName. The webhook
              resolves spec.serviceRef and enforces the prefix; the API type only
              constrains the shape.

              spec.phase is the provider-declared lifecycle intent:
              Draft -> Published -> Deprecated -> Retired. Draft documents are not
              fanned out. The controller mirrors that intent via conditions; it does
              not transition the phase itself.
            properties:
              billing:
                description: |-
                  Billing declares routing from metrics to monitored resource types.
                  Fans out into MeterDefinition billing CRDs.
                properties:
                  consumerDestinations:
                    description: ConsumerDestinations routes metrics to monitored
                      resource types for billing.
                    items:
                      description: |-
                        BillingConsumerDestination routes a set of metrics to a single monitored
                        resource type for billing attribution.
                      properties:
                        metrics:
                          description: |-
                            Metrics lists the metric names routed to this resource type for billing.
                            Each entry must match a spec.metrics[].name.
                          items:
                            type: string
                          maxItems: 256
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        monitoredResourceType:
                          description: |-
                            MonitoredResourceType is the canonical type identifier, e.g.
                            "compute.datumapis.com/Instance". Must match a spec.monitoredResourceTypes[].type.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - metrics
                      - monitoredResourceType
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - monitoredResourceType
                    x-kubernetes-list-type: map
                  quotaGating:
                    default: OrganizationDefault
                    description: |-
                      QuotaGating controls whether quota for this service is gated on the
                      account's active BillingEntitlement Offer.
                    enum:
                    - OrganizationDefault
                    - BillingEntitlement
                    type: string
                type: object
              charges:
                description: |-
                  Charges declares Usage, OneTime, and Recurring charges for this
                  service. Fans out to ServicePricing resources distinguished by
                  chargeType. Usage charges reference metrics by name; metrics
                  themselves stay telemetry/quota-only.
                items:
                  description: |-
                    ServiceChargeSpec declares a Usage, OneTime, or Recurring charge for a
                    service. Fans out to a ServicePricing with the matching chargeType.
                    Metrics are referenced by name for Usage charges and are never priced
                    in-place on the metric itself.
                  properties:
                    amount:
                      description: |-
                        Amount is the fixed USD decimal string for OneTime and Recurring
                        charges.
                      pattern: ^(0|[1-9]\d*)(\.\d+)?$
                      type: string
                    chargeType:
                      description: ChargeType is Usage, OneTime, or Recurring.
                      enum:
                      - Usage
                      - OneTime
                      - Recurring
                      type: string
                    currency:
                      default: USD
                      description: Currency is the ISO 4217 currency code. USD only
                        in v1.
                      pattern: ^USD$
                      type: string
                    displayName:
                      description: DisplayName is a human-readable label for invoices
                        and portals.
                      maxLength: 128
                      type: string
                    interval:
                      description: |-
                        Interval is the cadence for a Recurring charge. Required when
                        chargeType is Recurring.
                      enum:
                      - monthly
                      type: string
                    metricRef:
                      description: |-
                        MetricRef is the full metric name this Usage charge prices. Must
                        match a spec.metrics[].name. Required when chargeType is Usage.
                      maxLength: 253
                      type: string
                    name:
                      description: |-
                        Name uniquely identifies this charge within the ServiceConfiguration
                        and must be prefixed with the Service's canonical serviceName (same
                        rule as metrics) so ServicePricing metadata.name stays unique in
                        milo-system. Immutable once the ServiceConfiguration is Published.
                      maxLength: 253
                      minLength: 1
                      type: string
                    pricingUnit:
                      description: |-
                        PricingUnit is a human-readable billing unit label (e.g. "vcpu",
                        "gib"). Required when chargeType is Usage. Does not need to be the
                        literal UCUM unit string of the meter.
                      maxLength: 64
                      type: string
                    rates:
                      description: |-
                        Rates is the ordered list of rate entries for Usage charges.
                        Required when chargeType is Usage.
                      items:
                        description: |-
                          PricingRateEntry is a single Usage rate. Exactly one of Flat or Tiered
                          must be set. An optional Match filters the rate by dimension value; the
                          last unmatched entry is the default catch-all.
                        properties:
                          flat:
                            description: |-
                              Flat is a single decimal USD string multiplied by metered usage.
                              Mutually exclusive with Tiered.
                            pattern: ^(0|[1-9]\d*)(\.\d+)?$
                            type: string
                          match:
                            description: Match optionally restricts this rate to a
                              single dimension value.
                            properties:
                              dimension:
                                description: |-
                                  Dimension is the label key declared on the metric (e.g. "tier",
                                  "region", "model").
                                maxLength: 63
                                minLength: 1
                                type: string
                              value:
                                description: Value is the dimension value this rate
                                  applies to.
                                maxLength: 253
                                minLength: 1
                                type: string
                            required:
                            - dimension
                            - value
                            type: object
                          tiered:
                            description: |-
                              Tiered is an ordered list of graduated volume bands.
                              Mutually exclusive with Flat.
                            items:
                              description: |-
                                PricingTierBand is a single graduated volume band. Aggregation for tier
                                breaks is monthly at billing-account scope. Each band has a rate and an
                                exclusive upper bound upTo in pricingUnit units. The last band omits
                                upTo (open-ended).
                              properties:
                                rate:
                                  description: |-
                                    Rate is the USD decimal string applied to usage within this band.
                                    Zero ("0") is valid for free allowances.
                                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                                  type: string
                                upTo:
                                  description: |-
                                    UpTo is the exclusive upper bound of this band in pricingUnit units.
                                    Omit on the last band for an open-ended range.
                                  pattern: ^(0|[1-9]\d*)(\.\d+)?$
                                  type: string
                              required:
                              - rate
                              type: object
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: atomic
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of flat or tiered must be set
                          rule: has(self.flat) != has(self.tiered)
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    trigger:
                      description: |-
                        Trigger identifies when a OneTime charge fires. Required when
                        chargeType is OneTime.
                      enum:
                      - BillingAccountActivation
                      type: string
                  required:
                  - chargeType
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: Usage charges require metricRef, pricingUnit, and rates
                    rule: self.chargeType != 'Usage' || (has(self.metricRef) && has(self.pricingUnit)
                      && has(self.rates))
                  - message: OneTime charges require amount and trigger
                    rule: self.chargeType != 'OneTime' || (has(self.amount) && has(self.trigger))
                  - message: Recurring charges require amount and interval
                    rule: self.chargeType != 'Recurring' || (has(self.amount) && has(self.interval))
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              defaultOffer:
                description: |-
                  DefaultOffer is the Offer name applied to new BillingAccounts.
                  Typically set only on the billing.miloapis.com ServiceConfiguration.
                  When set, the referenced Offer must exist, have launchStage GA, and
                  carry a non-empty servicePricings snapshot.
                maxLength: 253
                type: string
              locations:
                description: |-
                  Locations declares which location classes this service version
                  supports. The LocationBindingReconciler uses it together with
                  Location readiness and ServiceAvailability to decide which locations
                  to project into entitled projects. Class selectors are used rather
                  than specific location names so new PoPs of a supported class become
                  available without a new configuration version.
                properties:
                  supportedClasses:
                    description: |-
                      SupportedClasses is the set of location classes this service version
                      runs on. The LocationBindingReconciler projects a Location into an
                      entitled project only when the Location's class appears here.
                    items:
                      description: "LocationClassName is the operational class of
                        a Location. It is a typed\nenum rather than a free-form string
                        so that service providers can\nreliably reference classes
                        in ServiceConfiguration.spec.locations and so\nthat controllers
                        and IAM constraints can branch on a closed set.\n\n\tdatum-managed
                        \      -> shared PoP operated by the Datum platform team\n\tprovider-dedicated
                        \ -> infrastructure a provider dedicates to a consumer\n\tself-managed
                        \       -> consumer-registered on-premises site"
                      enum:
                      - datum-managed
                      - provider-dedicated
                      - self-managed
                      type: string
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - supportedClasses
                type: object
              metrics:
                description: |-
                  Metrics declares metric descriptors for this service. Each entry becomes
                  a MeterDefinition in the billing system when routed via spec.billing.
                  Replaces spec.meters[].
                items:
                  description: MetricSpec is a single metric descriptor declared by
                    a ServiceConfiguration.
                  properties:
                    description:
                      description: Description is a plain-English explanation of what
                        the metric measures.
                      maxLength: 1024
                      type: string
                    dimensions:
                      description: |-
                        Dimensions is an ordered list of attribute keys that downstream
                        systems may group, filter, or price by (e.g. "model", "region",
                        "tier"). Each key must be declared here for a producer to attach it
                        to a usage event; the billing validator quarantines events carrying
                        undeclared dimension keys. Adding a dimension is additive; removing
                        one is a breaking change and must ship as a new meter. Fans out to
                        MeterDefinition.spec.measurement.dimensions.
                      items:
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: atomic
                    displayName:
                      description: DisplayName is a human-readable label shown in
                        portals and invoices.
                      maxLength: 128
                      type: string
                    kind:
                      description: Kind is the metric kind. Immutable once Published.
                      enum:
                      - Delta
                      - Gauge
                      - Cumulative
                      type: string
                    name:
                      description: |-
                        Name is the canonical metric identifier prefixed by the service name,
                        e.g. "compute.datumapis.com/instance/cpu-seconds". Immutable once Published.
                      maxLength: 253
                      minLength: 1
                      type: string
                    unit:
                      description: |-
                        Unit is the UCUM emission unit, e.g. "s", "By", "{request}", "1".
                        This is the unit the producer emits. Immutable once Published.
                      maxLength: 64
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - name
                  - unit
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              monitoredResourceTypes:
                description: |-
                  MonitoredResourceTypes declares the Kubernetes Kinds this service
                  emits usage for, together with the closed set of labels each
                  Kind's usage events may carry. Entries are keyed by .type, which
                  must be unique within the document.
                items:
                  description: |-
                    MonitoredResourceTypeSpec is a monitored resource type declared by
                    a ServiceConfiguration. The fan-out produces one
                    billing.miloapis.com/MonitoredResourceType per entry.
                  properties:
                    description:
                      description: |-
                        Description is a plain-English explanation of what the resource
                        type represents.
                      maxLength: 1024
                      type: string
                    displayName:
                      description: |-
                        DisplayName is a human-readable name surfaced in portals and
                        dashboards alongside the canonical type.
                      maxLength: 128
                      type: string
                    gvk:
                      description: |-
                        GVK pins the resource type to a Kubernetes Kind. Version is
                        deliberately omitted: billability is a property of the Kind, not
                        of a specific API version. Immutable once the
                        ServiceConfiguration is Published.
                      properties:
                        group:
                          description: |-
                            Group is the Kubernetes API group of the Kind (e.g.
                            "compute.miloapis.com").
                          maxLength: 253
                          minLength: 1
                          type: string
                        kind:
                          description: Kind is the Kubernetes Kind (e.g. "Instance").
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - group
                      - kind
                      type: object
                    labels:
                      description: |-
                        Labels is the closed set of descriptive labels that usage events
                        against this resource type are permitted to carry. Events whose
                        labels are not in this set are rejected at the edge.
                      items:
                        description: |-
                          MonitoredResourceLabel declares a single descriptive label that
                          usage events against the resource type may carry.
                        properties:
                          description:
                            description: |-
                              Description is a plain-English explanation of what the label
                              conveys.
                            maxLength: 512
                            type: string
                          name:
                            description: |-
                              Name is the label key as it will appear on usage events (e.g.
                              "region", "zone", "tier"). It is the map key for the enclosing
                              list.
                            maxLength: 63
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      maxItems: 64
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    type:
                      description: |-
                        Type is the canonical, user-facing identifier for this resource
                        type (e.g. "compute.miloapis.com/Instance"). Must be prefixed by
                        the referenced Service's spec.serviceName and unique within
                        spec.monitoredResourceTypes. Immutable once the
                        ServiceConfiguration is Published.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - gvk
                  - type
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              phase:
                allOf:
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                - enum:
                  - Draft
                  - Published
                  - Deprecated
                  - Retired
                default: Draft
                description: |-
                  Phase is the provider-declared lifecycle state of this
                  configuration. Allowed transitions are forward-only:
                  Draft -> Published -> Deprecated -> Retired.
                type: string
              quota:
                description: |-
                  Quota declares quota limits and metric rules for this service.
                  Fans out into ResourceRegistration and ClaimCreationPolicy quota CRDs.
                properties:
                  limits:
                    description: |-
                      Limits declares per-consumer quota ceilings. Each entry fans out to a
                      ResourceRegistration in the quota system.
                    items:
                      description: QuotaLimitSpec declares a single quota ceiling
                        for a metric.
                      properties:
                        consumerType:
                          description: |-
                            ConsumerType identifies the resource kind that receives quota grants.
                            Immutable once Published.
                          properties:
                            apiGroup:
                              type: string
                            kind:
                              type: string
                          required:
                          - apiGroup
                          - kind
                          type: object
                        defaultLimit:
                          description: DefaultLimit is the quota granted to new consumers
                            on service activation.
                          format: int64
                          minimum: 0
                          type: integer
                        description:
                          description: |-
                            Description is a plain-English explanation of what this quota limits
                            (e.g. "Maximum number of compute instances per project"). Propagated to
                            the generated ResourceRegistration's kubernetes.io/description annotation.
                          maxLength: 1024
                          type: string
                        displayName:
                          description: |-
                            DisplayName is a human-readable name for this quota surfaced in portals
                            and dashboards (e.g. "Instances"). Propagated to the generated
                            ResourceRegistration's kubernetes.io/display-name annotation.
                          maxLength: 128
                          type: string
                        maxLimit:
                          description: MaxLimit is the maximum quota any override
                            may grant. Zero means no cap.
                          format: int64
                          minimum: 0
                          type: integer
                        metric:
                          description: |-
                            Metric is the metric name this limit applies to.
                            Must match a spec.metrics[].name. Immutable once Published.
                          type: string
                        name:
                          description: |-
                            Name is a unique identifier for this limit within the ServiceConfiguration.
                            Immutable once Published.
                          maxLength: 253
                          minLength: 1
                          type: string
                        unit:
                          description: Unit is the quota unit expression, e.g. "1/{project}".
                            Immutable once Published.
                          maxLength: 64
                          minLength: 1
                          type: string
                      required:
                      - consumerType
                      - defaultLimit
                      - metric
                      - name
                      - unit
                      type: object
                    maxItems: 128
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  metricRules:
                    description: |-
                      MetricRules declares ClaimCreationPolicy CRDs that gate resource creation
                      by quota availability. The selector uses apiGroup + kind only; the fan-out
                      resolves the preferred API version at reconcile time.
                    items:
                      description: |-
                        QuotaMetricRule declares a ClaimCreationPolicy: which resource kind triggers
                        quota claim creation, and what metric costs are incurred per creation.
                      properties:
                        metricCosts:
                          additionalProperties:
                            format: int64
                            type: integer
                          description: |-
                            MetricCosts maps metric names to integer amounts claimed per resource
                            creation. Each key must match a spec.metrics[].name.
                          minProperties: 1
                          type: object
                        selector:
                          description: |-
                            Selector identifies the resource kind by apiGroup + kind. Version is
                            intentionally omitted; the fan-out resolves it via the discovery API so
                            this config does not need updating when API versions change.
                          properties:
                            apiGroup:
                              description: APIGroup is the Kubernetes API group, e.g.
                                "compute.datumapis.com".
                              maxLength: 253
                              minLength: 1
                              type: string
                            kind:
                              description: Kind is the Kubernetes Kind, e.g. "Workload".
                              maxLength: 63
                              minLength: 1
                              type: string
                          required:
                          - apiGroup
                          - kind
                          type: object
                      required:
                      - metricCosts
                      - selector
                      type: object
                    maxItems: 128
                    type: array
                type: object
              serviceRef:
                description: |-
                  ServiceRef points at the Service this document configures. The
                  reference is by metadata.name of the cluster-scoped Service
                  resource; the webhook resolves it to the Service's canonical
                  spec.serviceName for prefix enforcement.
                properties:
                  name:
                    description: |-
                      Name is the metadata.name of the cluster-scoped Service resource
                      this ServiceConfiguration configures.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              version:
                description: |-
                  Version is an optional human-readable version string for this
                  configuration document (e.g. "v1", "2024-01-15"). It has no
                  semantic meaning to the controller and is surfaced as a table
                  column for operator convenience.
                maxLength: 64
                type: string
            required:
            - phase
            - serviceRef
            type: object
          status:
            description: |-
              ServiceConfigurationStatus defines the observed state of a
              ServiceConfiguration. The controller records compact top-level
              conditions here; per-item status lives on the downstream billing
              objects themselves.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              publishedAt:
                description: |-
                  PublishedAt is the time at which the controller first observed
                  the resource in the Published phase. It is preserved across
                  later transitions to Deprecated and Retired so downstream systems
                  can reason about how long the resource has been part of the
                  catalog.
                format: date-time
                type: string
              serviceName:
                description: |-
                  ServiceName is the resolved canonical reverse-DNS name of the
                  referenced Service (e.g. "compute.datumapis.com"). Populated by
                  the controller after the serviceRef is successfully resolved.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
