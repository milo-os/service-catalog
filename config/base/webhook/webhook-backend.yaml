# Source of truth for the Service that backs the admission webhooks. Consumed
# only as a `replacements` source by this component's kustomization.yaml.
# Marked local-config so kustomize never emits it as a cluster object.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-backend
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  name: services-webhook
  namespace: services-system
