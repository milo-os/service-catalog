apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
# manifests.yaml is generated by controller-gen and should NOT be edited
# directly — `make manifests` will overwrite it. controller-gen always emits
# the placeholder clientConfig service `webhook-service`/`system`; the
# replacements below rewrite every webhook to the real backend.
- manifests.yaml
# Local-only source of truth for the webhook backend Service name/namespace.
# Annotated config.kubernetes.io/local-config so it is consumed as a
# replacements source but never emitted as a cluster object.
- webhook-backend.yaml

# Rename the controller-gen objects. metadata/name is not list-indexed, so a
# simple patch is robust here.
patches:
- patch: |-
    - op: replace
      path: /metadata/name
      value: services-mutating
  target:
    kind: MutatingWebhookConfiguration
    name: mutating-webhook-configuration
- patch: |-
    - op: replace
      path: /metadata/name
      value: services-validating
  target:
    kind: ValidatingWebhookConfiguration
    name: validating-webhook-configuration

# Point every webhook's clientConfig at the real backend Service. The `*`
# wildcard covers all webhooks regardless of count or order, so adding or
# reordering webhooks needs no change here (unlike index-based JSON patches).
# Namespace is set ONLY by these replacements — it is deliberately not driven
# by the global `namespace:` transform — so a consumer overlay's Flux
# `targetNamespace` can relocate the CRDs/roles without dragging the webhook
# clientConfig along with them.
replacements:
- source:
    kind: ConfigMap
    name: webhook-backend
    fieldPath: data.name
  targets:
  - select:
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.name
  - select:
      kind: MutatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.name
- source:
    kind: ConfigMap
    name: webhook-backend
    fieldPath: data.namespace
  targets:
  - select:
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.namespace
  - select:
      kind: MutatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.namespace
