# pnpm settings for the UI. It is a single package, not a workspace: there is
# no `packages:` list.

# Wait a day before installing a newly published version. Most compromised
# releases are pulled within hours. Our own packages are published and
# consumed across repos on the same day, so the delay must not hold them back.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# Reject a version published with weaker provenance than the versions before
# it, such as a release pushed with a stolen token for a package that normally
# publishes from CI.
trustPolicy: no-downgrade

# Only scripts a local install needs: esbuild checks its platform binary. The
# image installs with --ignore-scripts.
allowBuilds:
  esbuild: true

overrides:
  '@babel/core@<7.29.6': ^7.29.6
  morgan@<1.12.1: ^1.12.1
  qs@<6.16.0: ^6.16.0
  vite@<6.4.4: ^6.4.4
  esbuild: ^0.28.0
  # Through @babel/core. 6.3.1 has no provenance and trustPolicy rejects it;
  # 6.3.2 publishes from CI.
  semver@6: ^6.3.2
  # Through @react-router/dev (^4). 4.0.2 and 4.0.3 dropped the provenance
  # 4.0.0 and 4.0.1 have, so stay on 4.0.1.
  chokidar@4: 4.0.1
