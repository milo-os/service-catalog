version: "2"
run:
  timeout: 5m
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax
    rules:
      - linters:
          - staticcheck
        text: 'SA1019: \(k8s\.io/apimachinery/pkg/apis/meta/v1\.FieldsV1\)\.Raw is deprecated'
    paths:
      - third_party$
      - builtin$
