kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sc-milo
nodes:
  - role: control-plane
    extraPortMappings:
      # Milo's NodePort. The chainsaw suites run on the host and address project
      # control planes by URL path, so they need to reach Milo directly; on
      # macOS the kind node's cluster network is not host-routable.
      #
      # 32460 rather than a lower port because other kind clusters on a
      # developer's machine commonly hold 30443 and 32450. If it collides,
      # change it here and in config/overlays/e2e-milo/flux/milo.yaml.
      - containerPort: 32460
        hostPort: 32460
        protocol: TCP
