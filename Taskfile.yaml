version: '3'

vars:
  TOOL_DIR: "{{.USER_WORKING_DIR}}/bin"
  SERVICES_IMAGE_NAME: "ghcr.io/milo-os/service-catalog"
  SERVICES_IMAGE_TAG: "dev"
  TEST_INFRA_CLUSTER_NAME: "test-infra"
  MILO_KUBECONFIG: "test/e2e-milo/kubeconfig.yaml"
  TEST_INFRA_REPO_REF: 'v0.6.0'
  CONTROLLER_TOOLS_VERSION: "v0.16.4"
  DEFAULTER_GEN_VERSION: "v0.32.3"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  # renovate: datasource=go depName=github.com/kyverno/chainsaw
  # v0.2.14 and earlier fail to build against newer Go toolchains (missing
  # testing.testDeps.ModulePath) — keep this at v0.2.15+.
  CHAINSAW_VERSION: v0.2.15

includes:
  # Must set TASK_X_REMOTE_TASKFILES=1 to use this feature.
  test-infra:
    taskfile: https://raw.githubusercontent.com/datum-cloud/test-infra/{{.TEST_INFRA_REPO_REF}}/Taskfile.yml
    vars:
      REPO_REF: "{{.TEST_INFRA_REPO_REF}}"

  ui:
    taskfile: ./ui/Taskfile.yaml
    dir: ./ui

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  # Code generation
  generate:
    desc: Run code generation (deepcopy, defaults, typed clientset)
    cmds:
      - bash hack/update-codegen.sh
    silent: true

  verify:
    desc: Verify committed generated code is up to date (used by CI)
    cmds:
      - bash hack/verify-codegen.sh
    silent: false

  manifests:
    desc: Generate CRD, RBAC, and webhook manifests
    cmds:
      - |
        set -e
        echo "Generating manifests..."
        {{.TOOL_DIR}}/controller-gen rbac:roleName=services-controller-manager \
          crd:generateEmbeddedObjectMeta=true \
          webhook \
          paths="./..." \
          output:crd:artifacts:config=config/base/crd/bases \
          output:rbac:artifacts:config=config/components/controller_rbac \
          output:webhook:artifacts:config=config/base/webhook
        echo "Manifests generated!"
    deps:
      - install-tools
    silent: true

  build:
    desc: Build the services binary
    cmds:
      - |
        set -e
        echo "Building services..."
        mkdir -p {{.TOOL_DIR}}

        GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
        VERSION="v0.0.0-dev+${GIT_COMMIT:0:7}"
        GIT_TREE_STATE="clean"
        if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
          GIT_TREE_STATE="dirty"
        fi
        BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo "unknown")

        echo "Version: ${VERSION}, Commit: ${GIT_COMMIT:0:7}, Tree: ${GIT_TREE_STATE}"

        go build \
          -ldflags="-X 'main.version=${VERSION}' \
                    -X 'main.gitCommit=${GIT_COMMIT}' \
                    -X 'main.gitTreeState=${GIT_TREE_STATE}' \
                    -X 'main.buildDate=${BUILD_DATE}'" \
          -o {{.TOOL_DIR}}/services ./cmd/services
        echo "Binary built: {{.TOOL_DIR}}/services"
    silent: true

  test:
    desc: Run Go tests
    cmds:
      - go test -timeout 5m ./... -count=1
    silent: false

  lint:
    desc: Run golangci-lint
    cmds:
      - "{{.TOOL_DIR}}/golangci-lint run ./..."
    deps:
      - install-tools
    silent: false

  # Tool installation
  install-tools:
    desc: Install required development tools
    cmds:
      - |
        set -e
        mkdir -p {{.TOOL_DIR}}

        # controller-gen
        if [ ! -f "{{.TOOL_DIR}}/controller-gen-{{.CONTROLLER_TOOLS_VERSION}}" ]; then
          echo "Installing controller-gen {{.CONTROLLER_TOOLS_VERSION}}..."
          GOBIN={{.TOOL_DIR}} go install sigs.k8s.io/controller-tools/cmd/controller-gen@{{.CONTROLLER_TOOLS_VERSION}}
          mv {{.TOOL_DIR}}/controller-gen {{.TOOL_DIR}}/controller-gen-{{.CONTROLLER_TOOLS_VERSION}}
        fi
        ln -sf {{.TOOL_DIR}}/controller-gen-{{.CONTROLLER_TOOLS_VERSION}} {{.TOOL_DIR}}/controller-gen

        # defaulter-gen
        if [ ! -f "{{.TOOL_DIR}}/defaulter-gen-{{.DEFAULTER_GEN_VERSION}}" ]; then
          echo "Installing defaulter-gen {{.DEFAULTER_GEN_VERSION}}..."
          GOBIN={{.TOOL_DIR}} go install k8s.io/code-generator/cmd/defaulter-gen@{{.DEFAULTER_GEN_VERSION}}
          mv {{.TOOL_DIR}}/defaulter-gen {{.TOOL_DIR}}/defaulter-gen-{{.DEFAULTER_GEN_VERSION}}
        fi
        ln -sf {{.TOOL_DIR}}/defaulter-gen-{{.DEFAULTER_GEN_VERSION}} {{.TOOL_DIR}}/defaulter-gen

        # golangci-lint
        if [ ! -f "{{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}" ]; then
          echo "Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.TOOL_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
          mv {{.TOOL_DIR}}/golangci-lint {{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}
        fi
        ln -sf {{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}} {{.TOOL_DIR}}/golangci-lint
    silent: true
    status:
      - test -f {{.TOOL_DIR}}/controller-gen-{{.CONTROLLER_TOOLS_VERSION}}
      - test -f {{.TOOL_DIR}}/defaulter-gen-{{.DEFAULTER_GEN_VERSION}}
      - test -f {{.TOOL_DIR}}/golangci-lint-{{.GOLANGCI_LINT_VERSION}}

  # Development tasks
  dev:build:
    desc: Build the services container image for development
    silent: true
    cmds:
      - |
        set -e
        echo "Building services container image: {{.SERVICES_IMAGE_NAME}}:{{.SERVICES_IMAGE_TAG}}"

        GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
        VERSION="v0.0.0-dev+${GIT_COMMIT:0:7}"
        GIT_TREE_STATE="clean"
        if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
          GIT_TREE_STATE="dirty"
        fi
        BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo "unknown")

        docker build \
          --build-arg VERSION="${VERSION}" \
          --build-arg GIT_COMMIT="${GIT_COMMIT}" \
          --build-arg GIT_TREE_STATE="${GIT_TREE_STATE}" \
          --build-arg BUILD_DATE="${BUILD_DATE}" \
          -t "{{.SERVICES_IMAGE_NAME}}:{{.SERVICES_IMAGE_TAG}}" .
        echo "Successfully built {{.SERVICES_IMAGE_NAME}}:{{.SERVICES_IMAGE_TAG}}"

  dev:load:
    desc: Load the services container image into the kind cluster
    silent: true
    cmds:
      - |
        set -e
        echo "Loading image {{.SERVICES_IMAGE_NAME}}:{{.SERVICES_IMAGE_TAG}} into kind cluster '{{.TEST_INFRA_CLUSTER_NAME}}'..."
        kind load docker-image "{{.SERVICES_IMAGE_NAME}}:{{.SERVICES_IMAGE_TAG}}" --name "{{.TEST_INFRA_CLUSTER_NAME}}"
        echo "Successfully loaded image into kind cluster"

  dev:setup:
    desc: Setup lightweight dev environment
    silent: true
    cmds:
      - task: test-infra:cluster-up
      - task: dev:build
      - task: dev:load
      - task: dev:deploy

  dev:deploy:
    desc: Deploy services using dev overlay
    silent: true
    cmds:
      - |
        set -e
        echo "Deploying services (dev overlay)..."
        task test-infra:kubectl -- apply -k config/overlays/dev

        echo "Waiting for services controller..."
        task test-infra:kubectl -- wait --for=condition=ready pod -l app=services -n services-system --timeout=120s || echo "Services pods not ready yet"

        echo ""
        echo "Services deployed (dev overlay)!"

  dev:redeploy:
    desc: Quick rebuild and redeploy for dev environment
    deps:
      - dev:build
      - dev:load
    cmds:
      - |
        set -e
        echo "Redeploying services (dev)..."
        task test-infra:kubectl -- rollout restart -n services-system deployment/services || echo "Deployment not found, run 'task dev:deploy' first"

        echo "Waiting for rollout..."
        task test-infra:kubectl -- rollout status -n services-system deployment/services --timeout=120s || true
        echo "Redeployment complete!"
    silent: true

  # E2E Testing
  e2e:setup:
    desc: Spin up a kind cluster and deploy services using the e2e overlay (mirrors .github/workflows/e2e.yml)
    silent: true
    cmds:
      - task: test-infra:cluster-up
      - task: dev:build
      - task: dev:load
      - |
        set -e
        echo "Installing billing CRDs..."
        task test-infra:kubectl -- apply -f config/overlays/e2e/billing-crds.yaml
        task test-infra:kubectl -- wait kustomization/billing-crds -n flux-system --for=condition=ready --timeout=120s

        echo "Installing LocationBinding CRD..."
        task test-infra:kubectl -- apply -f config/overlays/e2e/locationbinding-crd.yaml

        echo "Installing resourcemanager CRDs..."
        task test-infra:kubectl -- apply -f config/overlays/e2e/resourcemanager-crds.yaml

        echo "Deploying services (e2e overlay)..."
        task test-infra:kubectl -- apply -k config/overlays/e2e
        task test-infra:kubectl -- wait --for=condition=available deployment/services-controller-manager -n services-system --timeout=120s

        echo "Waiting for webhook certificate to be ready..."
        task test-infra:kubectl -- wait --for=condition=ready certificate/services-serving-cert -n services-system --timeout=120s

        echo ""
        echo "e2e environment ready! Run 'task e2e' to execute the chainsaw suite."

  e2e-milo:setup:
    desc: Spin up the multi-project e2e environment — a real Milo control plane, three real Projects, and the operator wired to it (see test/e2e-milo/README.md)
    silent: true
    cmds:
      # The same cluster every other environment in this repo uses. What makes
      # this one different is not the cluster: it is that a real Milo runs in it
      # and the operator is pointed at Milo rather than at the cluster's own API
      # server, so each project's control plane is separately addressable.
      #
      # It is therefore the same services-system as config/overlays/e2e, and the
      # two are mutually exclusive on one machine — whichever was set up last
      # owns the operator. In CI they run on separate runners.
      - task: test-infra:cluster-up
      - task: dev:build
      - task: dev:load
      - |
        set -e
        echo "Deploying Milo..."
        task test-infra:kubectl -- apply -k config/overlays/e2e-milo/milo
        task test-infra:kubectl -- -n milo-system rollout status statefulset/etcd --timeout=180s
        task test-infra:kubectl -- -n milo-system rollout status deployment/milo-apiserver --timeout=300s

        # Rolled out is not the same as reachable: this is the first traffic
        # over the Gateway, and the route is programmed asynchronously.
        echo "Waiting for Milo to answer through the gateway..."
        for _ in $(seq 1 60); do
          kubectl --kubeconfig {{.MILO_KUBECONFIG}} --context milo-root get --raw /readyz >/dev/null 2>&1 && break
          sleep 2
        done
        kubectl --kubeconfig {{.MILO_KUBECONFIG}} --context milo-root get --raw /readyz >/dev/null

        # Before the operator, deliberately. The manager exits at startup if a
        # kind it indexes is not yet served, and CRD registration reaches
        # discovery asynchronously.
        echo "Installing the API surface into Milo..."
        kubectl --kubeconfig {{.MILO_KUBECONFIG}} apply -k config/overlays/e2e-milo/milo-resources
        kubectl --kubeconfig {{.MILO_KUBECONFIG}} apply -f config/overlays/e2e/ipclass-crd.yaml
        kubectl --kubeconfig {{.MILO_KUBECONFIG}} apply -f config/overlays/e2e/locationbinding-crd.yaml

        echo "Creating projects..."
        kubectl --kubeconfig {{.MILO_KUBECONFIG}} apply -k config/overlays/e2e-milo/projects
        # Ready is patched here because no Milo controller-manager is deployed.
        # The provider engages a project only once Ready is true, so this is
        # what makes the project's control plane reachable to the operator.
        for p in e2e-provisioning-platform e2e-provisioning-consumer-a e2e-provisioning-consumer-b; do
          kubectl --kubeconfig {{.MILO_KUBECONFIG}} patch project "$p" --type=merge --subresource=status \
            -p "{\"status\":{\"conditions\":[{\"type\":\"Ready\",\"status\":\"True\",\"reason\":\"E2EBootstrap\",\"message\":\"set by task e2e-milo:setup\",\"lastTransitionTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}}" >/dev/null
        done

        echo "Deploying the operator..."
        task test-infra:kubectl -- apply -k config/overlays/e2e-milo/operator
        task test-infra:kubectl -- -n services-system wait --for=condition=ready certificate/services-serving-cert --timeout=120s

        # cert-manager's ca-injector only watches the cluster it runs in, and
        # these webhook configurations live in Milo. Stamp the CA it issued.
        echo "Injecting the webhook CA into Milo..."
        ca="$(task test-infra:kubectl -- -n services-system get secret services-webhook-cert -o jsonpath='{.data.ca\.crt}')"
        [ -n "$ca" ] || { echo "services-webhook-cert has no ca.crt" >&2; exit 1; }
        for cfg in validatingwebhookconfigurations/services-validating mutatingwebhookconfigurations/services-mutating; do
          patch="$(kubectl --kubeconfig {{.MILO_KUBECONFIG}} get "$cfg" -o json |
            jq -c --arg ca "$ca" '[.webhooks | to_entries[] |
              {op: "replace", path: "/webhooks/\(.key)/clientConfig/caBundle", value: $ca}]')"
          kubectl --kubeconfig {{.MILO_KUBECONFIG}} patch "$cfg" --type=json -p "$patch" >/dev/null
        done

        task test-infra:kubectl -- -n services-system rollout status deployment/services-controller-manager --timeout=180s

        # A suite that runs before a project is engaged fails as though the
        # operator were broken, so wait — and fail here rather than time out
        # quietly, because a silent wait that never matches is
        # indistinguishable from one that did.
        echo "Waiting for the operator to engage every project..."
        for p in e2e-provisioning-platform e2e-provisioning-consumer-a e2e-provisioning-consumer-b; do
          engaged=""
          for _ in $(seq 1 60); do
            # Captured before matching rather than piped into `grep -q`: under
            # `pipefail`, grep closing the pipe on its first match kills kubectl
            # with SIGPIPE and the successful match reads as a failed pipeline.
            log="$(task test-infra:kubectl -- -n services-system logs deployment/services-controller-manager --tail=-1 2>/dev/null || true)"
            if printf '%s' "$log" | grep -q "Successfully registered and engaged new cluster.*$p"; then
              engaged=yes
              break
            fi
            sleep 2
          done
          [ -n "$engaged" ] || {
            echo "project $p was never engaged by the operator" >&2
            task test-infra:kubectl -- -n services-system logs deployment/services-controller-manager --tail=100 >&2
            exit 1
          }
        done

        echo ""
        echo "e2e-milo environment ready! Run 'task e2e-milo' to execute the chainsaw suites."

  e2e-milo:
    desc: Run the multi-project chainsaw suites (requires 'task e2e-milo:setup' first)
    deps:
      - task: install-go-tool
        vars:
          NAME: chainsaw
          PACKAGE: github.com/kyverno/chainsaw
          VERSION: "{{.CHAINSAW_VERSION}}"
    cmds:
      # The cluster kubeconfig paths in the config are relative to this
      # directory, so chainsaw has to run from the repository root.
      #
      # KUBECONFIG is what chainsaw uses for anything not addressed to a named
      # cluster — including the ephemeral namespace it creates per test. Without
      # it that lands in whatever cluster the developer's ambient kubeconfig
      # happens to point at, which is not this one.
      - KUBECONFIG={{.MILO_KUBECONFIG}} "{{.TOOL_DIR}}/chainsaw" test --config test/e2e-milo/.chainsaw.yaml test/e2e-milo/
    silent: false

  e2e-milo:down:
    desc: Delete the e2e cluster
    silent: true
    cmds:
      - task: test-infra:cluster-down

  e2e:
    desc: Run chainsaw e2e tests (requires 'task e2e:setup' first)
    deps:
      - task: install-go-tool
        vars:
          NAME: chainsaw
          PACKAGE: github.com/kyverno/chainsaw
          VERSION: "{{.CHAINSAW_VERSION}}"
    cmds:
      - "{{.TOOL_DIR}}/chainsaw test --config test/e2e/.chainsaw.yaml test/e2e/"
    silent: false

  install-go-tool:
    desc: Install a Go tool (internal)
    silent: true
    internal: true
    cmds:
      - mkdir -p {{.TOOL_DIR}}
      - |
        set -e
        _NAME="{{.NAME}}"
        _PACKAGE="{{.PACKAGE}}"
        _VERSION="{{.VERSION}}"
        _TOOL_DIR="{{.TOOL_DIR}}"
        _VERSIONED="$_TOOL_DIR/$_NAME-$_VERSION"
        _SYMLINK="$_TOOL_DIR/$_NAME"

        if [ ! -f "$_VERSIONED" ]; then
          echo "Downloading $_PACKAGE@$_VERSION..."
          rm -f "$_SYMLINK" || true
          GOBIN="$_TOOL_DIR" go install "$_PACKAGE@$_VERSION"
          if [ ! -f "$_SYMLINK" ]; then
            echo "ERROR: go install did not produce $_SYMLINK"
            exit 1
          fi
          mv "$_SYMLINK" "$_VERSIONED"
        fi
        (cd "$_TOOL_DIR" && ln -sf "$_NAME-$_VERSION" "$_NAME")

  ui:docker-build:
    desc: Build the services UI Docker image
    silent: true
    cmds:
      - |
        echo "Building services UI image: ghcr.io/milo-os/services-ui:dev"
        docker build -t ghcr.io/milo-os/services-ui:dev ./ui
        echo "Successfully built services UI image"

  ui:kind-load:
    desc: Load the services UI image into kind cluster
    silent: true
    cmds:
      - |
        echo "Loading ghcr.io/milo-os/services-ui:dev into kind cluster '{{.TEST_INFRA_CLUSTER_NAME}}'..."
        kind load docker-image ghcr.io/milo-os/services-ui:dev --name "{{.TEST_INFRA_CLUSTER_NAME}}"
        echo "Successfully loaded UI image"

  ui:deploy:
    desc: Build UI image, load into kind, and deploy via kustomize
    deps:
      - ui:docker-build
      - ui:kind-load
    cmds:
      - |
        echo "Deploying services with UI overlay..."
        task test-infra:kubectl -- apply -k config/overlays/dev
        echo "Deployment applied!"

  ui:redeploy:
    desc: Quick rebuild and redeploy for the services-ui dev environment
    deps:
      - ui:docker-build
      - ui:kind-load
    cmds:
      - |
        set -e
        echo "Redeploying services-ui (dev)..."

        # Ensure imagePullPolicy is IfNotPresent so the freshly kind-loaded
        # image is used instead of pulling from ghcr.io.
        task test-infra:kubectl -- patch deployment services-ui -n services-system \
          --type=strategic \
          -p '{"spec":{"template":{"spec":{"containers":[{"name":"ui","imagePullPolicy":"IfNotPresent"}]}}}}' \
          || echo "Deployment not found, run 'task ui:deploy' first"

        # Restart pods so they pick up the freshly loaded image.
        task test-infra:kubectl -- rollout restart -n services-system deployment/services-ui \
          || echo "Deployment not found, run 'task ui:deploy' first"

        echo "Waiting for rollout..."
        task test-infra:kubectl -- rollout status -n services-system deployment/services-ui --timeout=120s || true

        # Restart the port-forward on 3001:3000. pkill is best-effort —
        # missing matches return non-zero, which we ignore.
        echo "Restarting port-forward 3001 -> services-ui:3000..."
        pkill -f "kubectl.*port-forward.*services-ui.*3001:3000" 2>/dev/null || true
        sleep 1
        nohup task test-infra:kubectl -- port-forward -n services-system svc/services-ui 3001:3000 \
          > /tmp/services-ui-port-forward.log 2>&1 &
        disown || true
        echo "Port-forward backgrounded (logs: /tmp/services-ui-port-forward.log)"

        echo "Redeployment complete! UI available at http://localhost:3001"
    silent: true
